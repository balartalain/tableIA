{% comment %}
Editor de condiciones {field, op, valor} del constructor. `list` es la expresión Alpine de la
lista que se edita (condiciones del widget, de una métrica o de una métrica por grupo).
{% endcomment %}
<div class="space-y-1">
  <template x-for="(c, ci) in {{ list }}" :key="c._k">
    <div class="flex flex-wrap items-center gap-1 rounded-lg bg-paper/70 border border-line/60 p-1">
      <select x-model="c.field" x-on:change="$store.dashboard.onConditionFieldChange(c)" aria-label="Columna"
              class="flex-1 min-w-[7rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
        <template x-for="f in $store.dashboard.schema.all_fields" :key="f">
          <option x-bind:value="f" x-text="f" x-bind:selected="f === c.field"></option>
        </template>
      </select>
      <select x-model="c.op" aria-label="Operador"
              class="w-32 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
        <template x-for="o in $store.dashboard.opOptionsFor(c.field)" :key="o.value">
          <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === c.op"></option>
        </template>
      </select>
      <template x-if="$store.dashboard.conditionUsesMode(c)">
        <select x-model="c.mode" aria-label="Tipo de valor"
                class="flex-1 min-w-[6rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
          <template x-for="o in $store.dashboard.valueModeOptions" :key="o.value">
            <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === c.mode"></option>
          </template>
        </select>
      </template>
      <template x-if="$store.dashboard.conditionNeedsValue(c)">
        <input type="text" x-model="c.value" x-bind:list="$store.dashboard.sampleListId(c.field)" aria-label="Valor"
               x-bind:placeholder="$store.dashboard.conditionIsList(c) ? 'Valores separados por coma' : (c.op === 'between' ? 'Desde' : 'Valor')"
               class="flex-1 min-w-[5rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
      </template>
      <template x-if="c.op === 'between'">
        <input type="number" x-model="c.value2" placeholder="Hasta" aria-label="Hasta"
               class="w-20 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
      </template>
      <button type="button" x-on:click="$store.dashboard.removeCondition({{ list }}, ci)"
              class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none"
              title="Quitar condición" aria-label="Quitar condición">×</button>
    </div>
  </template>
  <button type="button" x-on:click="$store.dashboard.addCondition({{ list }})"
          class="text-xs font-medium text-moss-700 hover:text-moss-800 cursor-pointer flex items-center gap-1">
    <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar condición
  </button>
</div>
