<!-- Visor JSON de solo lectura -->
<details class="text-xs">
  <summary class="cursor-pointer text-fg-muted hover:text-fg select-none">Ver JSON del widget</summary>
  <div class="mt-2 space-y-2">
    <div>
      <div class="font-semibold text-fg-muted mb-0.5">fields</div>
      <pre class="font-mono text-xs bg-app border border-line rounded p-2 max-h-56 overflow-auto whitespace-pre"
           x-text="JSON.stringify($store.dashboard.drawerDraft.fields, null, 2)"></pre>
    </div>
    <div>
      <div class="font-semibold text-fg-muted mb-0.5">style</div>
      <pre class="font-mono text-xs bg-app border border-line rounded p-2 max-h-56 overflow-auto whitespace-pre"
           x-text="JSON.stringify($store.dashboard.drawerDraft.style, null, 2)"></pre>
    </div>
  </div>
</details>
