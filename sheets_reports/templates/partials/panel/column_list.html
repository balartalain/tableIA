{% comment %}
ui «column-list» (Dimensions, Pivots, Columns): una lista de columnas de la hoja con «Agregar»
y × por fila. Del manifiesto: min/max, options, excludes, empty_label/empty_selectable,
add_label, sortable (arrastrar) y allow_all («Usar todas»).
{% endcomment %}
<div>
  <div class="space-y-1" x-init="part.sortable && $store.dashboard.initListSortable($el, part)">
    <template x-for="(v, i) in $store.dashboard.drawerDraft.builder[part.key]" :key="part.key + '-' + i">
      <div class="space-y-1" data-column-row>
        <div class="flex items-center gap-1">
          <template x-if="part.sortable">
            <i class="ti ti-grip-vertical column-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-ink/30 hover:text-ink/60 select-none"
               aria-hidden="true" title="Arrastra para reordenar"></i>
          </template>
          <select x-model="$store.dashboard.drawerDraft.builder[part.key][i]" x-on:change="$store.dashboard.onListChange(part)"
                  x-bind:aria-label="`${part.label} ${i + 1}`"
                  class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
            <option value="" x-show="part.empty_selectable || !$store.dashboard.drawerDraft.builder[part.key][i]" x-text="part.empty_label"></option>
            <template x-for="f in $store.dashboard.listOptions(part, i)" :key="f">
              <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder[part.key][i]"></option>
            </template>
          </select>
          {% include "partials/panel/column_row_inline.html" %}
          <button type="button" x-show="$store.dashboard.canRemoveListItem(part)" x-on:click="$store.dashboard.removeListItem(part, i)"
                  class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none"
                  title="Quitar" x-bind:aria-label="`Quitar ${part.label.toLowerCase()} ${i + 1}`">×</button>
        </div>
        {% include "partials/panel/column_row_below.html" %}
      </div>
    </template>
  </div>
  <div class="mt-1 flex items-center gap-3" x-show="part.max > 1">
    <button type="button" x-on:click="$store.dashboard.addListItem(part)" x-bind:disabled="!$store.dashboard.canAddListItem(part)"
            class="text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
      <i class="ti ti-plus text-sm" aria-hidden="true"></i>
      <span x-text="part.add_label"></span>
    </button>
    <button type="button" x-show="part.allow_all" x-on:click="$store.dashboard.useAllListItems(part)"
            class="text-xs font-medium text-ink/60 hover:text-ink/80 cursor-pointer">
      Usar todas
    </button>
  </div>
</div>
