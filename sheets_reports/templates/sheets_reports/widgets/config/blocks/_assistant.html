<!-- Chat con la IA del widget: cada pedido ajusta el borrador actual; cada respuesta llega
     como pasos con su botón «Aplicar y guardar». El hilo se conserva mientras el tablero está abierto. -->
<div class="rounded border border-accent-soft-border bg-accent-soft px-3 py-2">
  <button type="button" x-on:click="$store.dashboard.drawerAskOpen = !$store.dashboard.drawerAskOpen"
          x-bind:aria-expanded="$store.dashboard.drawerAskOpen"
          class="w-full flex items-center justify-between text-xs font-semibold text-accent-text cursor-pointer">
    <span class="flex items-center gap-1.5">
      <i class="ti ti-sparkles text-sm" aria-hidden="true"></i>
      Consultar a la IA
      <span x-show="$store.dashboard.drawerThread.length" x-cloak
            class="rounded-full bg-accent px-1.5 text-xs font-semibold leading-4 text-accent-on"
            x-text="$store.dashboard.drawerThread.filter(m => m.role === 'user').length"></span>
    </span>
    <i class="ti text-sm" x-bind:class="$store.dashboard.drawerAskOpen ? 'ti-chevron-up' : 'ti-chevron-down'" aria-hidden="true"></i>
  </button>

  <div x-show="$store.dashboard.drawerAskOpen" x-cloak class="mt-2 space-y-2">
    <!-- Pedidos sugeridos por la IA para este tipo y esta hoja: un clic los envía. -->
    <div x-show="$store.dashboard.drawerSuggestions.length"
         class="flex flex-wrap gap-1.5">
      <template x-for="s in $store.dashboard.drawerSuggestions" :key="s">
        <button type="button" x-on:click="$store.dashboard.askSuggestion(s)"
                x-bind:disabled="$store.dashboard.drawerAsking"
                class="max-w-full rounded-full border border-accent-soft-border bg-surface px-2.5 py-1 text-left text-xs text-accent-text hover:bg-accent-soft disabled:opacity-50 disabled:cursor-not-allowed transition cursor-pointer flex items-center gap-1">
          <i class="ti ti-sparkles text-xs shrink-0" aria-hidden="true"></i>
          <span class="min-w-0 break-words" x-text="s"></span>
        </button>
      </template>
      <!-- Otras ideas: pide 2 sugerencias nuevas (salta la caché del servidor). -->
      <button type="button" x-on:click="$store.dashboard.refreshSuggestions()"
              x-bind:disabled="$store.dashboard.drawerSuggestionsLoading || $store.dashboard.drawerAsking"
              title="Otras ideas" aria-label="Otras ideas"
              class="rounded-full border border-accent-soft-border bg-surface px-1.5 py-1 text-accent-text hover:bg-accent-soft disabled:opacity-50 disabled:cursor-not-allowed transition cursor-pointer flex items-center">
        <i class="ti ti-refresh text-xs" aria-hidden="true"
           x-bind:class="$store.dashboard.drawerSuggestionsLoading ? 'animate-spin' : ''"></i>
      </button>
    </div>

    <!-- Hilo de mensajes -->
    <div x-show="$store.dashboard.drawerThread.length"
         x-effect="$store.dashboard.drawerThread.length; $nextTick(() => { $el.scrollTop = $el.scrollHeight })"
         class="max-h-[28rem] overflow-y-auto space-y-2 pr-0.5">
      <template x-for="(m, i) in $store.dashboard.drawerThread" :key="i">
        <div>
          <!-- Pedido del usuario -->
          <template x-if="m.role === 'user'">
            <div class="flex justify-end">
              <p class="ml-8 max-w-full whitespace-pre-wrap break-words rounded bg-accent px-2.5 py-1.5 text-xs text-accent-on"
                 x-text="m.text"></p>
            </div>
          </template>

          <!-- Error de la IA -->
          <template x-if="m.role === 'assistant' && m.error">
            <p class="mr-8 rounded border border-danger bg-danger-bg px-2.5 py-1.5 text-xs text-danger"
               x-text="m.error"></p>
          </template>

          <!-- Propuesta de la IA: pasos + «Aplicar y guardar» / «Deshacer» -->
          <template x-if="m.role === 'assistant' && m.proposal">
            <div class="mr-4 rounded border border-line bg-surface p-3 space-y-3">
              <p class="text-xs font-semibold text-fg">La IA propone:</p>
              <ol class="space-y-2">
                <template x-for="(step, n) in $store.dashboard.adviceSteps(m.proposal, m.baseStyle)" :key="step.title">
                  <li class="flex gap-2">
                    <span class="shrink-0 h-5 w-5 rounded-full bg-accent text-accent-on text-xs font-semibold flex items-center justify-center"
                          x-text="n + 1"></span>
                    <div class="min-w-0 text-xs">
                      <p class="font-semibold text-fg" x-text="step.title"></p>
                      <template x-if="step.detail">
                        <p class="text-fg break-words" x-text="step.detail"></p>
                      </template>
                      <template x-if="step.details">
                        <ul class="list-disc pl-4 text-fg break-words">
                          <template x-for="(line, j) in step.details" :key="j">
                            <li x-text="line"></li>
                          </template>
                        </ul>
                      </template>
                    </div>
                  </li>
                </template>
              </ol>
              <div class="flex gap-1.5">
                <button type="button" x-on:click="$store.dashboard.applyAdvice(m)"
                        x-bind:disabled="$store.dashboard.drawerSaving"
                        x-bind:class="m.applied ? 'ui-btn-ghost' : 'ui-btn-secondary'"
                        class="ui-btn ui-btn-sm flex-1">
                  <i class="ti text-base" x-bind:class="m.applied ? 'ti-check' : 'ti-wand'" aria-hidden="true"></i>
                  <span x-text="m.applied ? 'Guardado · aplicar de nuevo' : 'Aplicar y guardar'"></span>
                </button>
                <button type="button" x-show="m.undo" x-cloak x-on:click="$store.dashboard.undoAdvice(m)"
                        x-bind:disabled="$store.dashboard.drawerSaving"
                        title="Vuelve el widget a como estaba antes de aplicar"
                        class="ui-btn ui-btn-secondary ui-btn-sm">
                  <i class="ti ti-arrow-back-up text-base" aria-hidden="true"></i>
                  Deshacer
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Nuevo mensaje: Enter envía, Mayús+Enter salta de línea -->
    <textarea x-model="$store.dashboard.drawerDraft.prompt" rows="2"
              x-on:keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); $store.dashboard.askAssistant() }"
              x-bind:placeholder="$store.dashboard.drawerThread.length ? 'Pide otro cambio…' : '¿Qué quieres ver o cambiar? (ej. ventas por categoría y año)'"
              class="w-full text-sm border border-line rounded-md px-3 py-2 bg-surface focus:outline-none focus:border-accent"></textarea>
    <div class="flex items-center gap-2">
      <button type="button" x-show="$store.dashboard.drawerThread.length" x-on:click="$store.dashboard.clearThread()"
              x-bind:disabled="$store.dashboard.drawerAsking"
              class="text-xs text-fg-muted hover:text-fg disabled:opacity-40 cursor-pointer flex items-center gap-1">
        <i class="ti ti-message-plus text-sm" aria-hidden="true"></i> Nueva conversación
      </button>
      <button type="button" x-on:click="$store.dashboard.askAssistant()"
              x-bind:disabled="$store.dashboard.drawerAsking || !($store.dashboard.drawerDraft.prompt || '').trim()"
              class="ui-btn ui-btn-primary ui-btn-sm ml-auto">
        <!-- Mientras la IA responde, el icono gira: no hace falta otro indicador en el hilo. -->
        <i class="ti text-base" aria-hidden="true"
           x-bind:class="$store.dashboard.drawerAsking ? 'ti-loader-2 animate-spin' : 'ti-send'"></i>
        Enviar
      </button>
    </div>
  </div>
</div>
