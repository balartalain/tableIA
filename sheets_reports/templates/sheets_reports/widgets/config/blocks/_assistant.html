<!-- Chat con la IA del widget: cada pedido ajusta el borrador actual; cada respuesta llega
     como pasos con su botón «Aplicar y guardar». El hilo se conserva mientras el tablero está abierto. -->
<div class="rounded-xl border border-moss-100 bg-moss-tint px-3 py-2">
  <button type="button" x-on:click="$store.dashboard.drawerAskOpen = !$store.dashboard.drawerAskOpen"
          x-bind:aria-expanded="$store.dashboard.drawerAskOpen"
          class="w-full flex items-center justify-between text-xs font-semibold text-moss-700 cursor-pointer">
    <span class="flex items-center gap-1.5">
      <i class="ti ti-sparkles text-sm" aria-hidden="true"></i>
      Consultar a la IA
      <span x-show="$store.dashboard.drawerThread.length" x-cloak
            class="rounded-full bg-moss-500 px-1.5 text-[10px] font-semibold leading-4 text-white"
            x-text="$store.dashboard.drawerThread.filter(m => m.role === 'user').length"></span>
    </span>
    <i class="ti text-sm" x-bind:class="$store.dashboard.drawerAskOpen ? 'ti-chevron-up' : 'ti-chevron-down'" aria-hidden="true"></i>
  </button>

  <div x-show="$store.dashboard.drawerAskOpen" x-cloak class="mt-2 space-y-2">
    <p x-show="!$store.dashboard.drawerThread.length" class="text-[11px] text-ink/60">
      Pide un cambio sobre este widget (ej. «agrega la columna producto», «ahora por mes») y la
      IA te dirá cómo quedaría. Recuerda la conversación mientras el tablero esté abierto.
    </p>

    <!-- Hilo de mensajes -->
    <div x-show="$store.dashboard.drawerThread.length"
         x-effect="$store.dashboard.drawerThread.length; $nextTick(() => { $el.scrollTop = $el.scrollHeight })"
         class="max-h-[28rem] overflow-y-auto space-y-2 pr-0.5">
      <template x-for="(m, i) in $store.dashboard.drawerThread" :key="i">
        <div>
          <!-- Pedido del usuario -->
          <template x-if="m.role === 'user'">
            <div class="flex justify-end">
              <p class="ml-8 max-w-full whitespace-pre-wrap break-words rounded-lg rounded-br-sm bg-moss-500 px-2.5 py-1.5 text-xs text-white"
                 x-text="m.text"></p>
            </div>
          </template>

          <!-- Error de la IA -->
          <template x-if="m.role === 'assistant' && m.error">
            <p class="mr-8 rounded-lg rounded-bl-sm border border-red-200 bg-red-50 px-2.5 py-1.5 text-xs text-red-700"
               x-text="m.error"></p>
          </template>

          <!-- Propuesta de la IA: pasos + «Aplicar y guardar» / «Deshacer» -->
          <template x-if="m.role === 'assistant' && m.proposal">
            <div class="mr-4 rounded-lg rounded-bl-sm border border-line bg-white p-3 space-y-3">
              <p class="text-xs font-semibold text-ink/70">La IA propone:</p>
              <ol class="space-y-2">
                <template x-for="(step, n) in $store.dashboard.adviceSteps(m.proposal)" :key="step.title">
                  <li class="flex gap-2">
                    <span class="shrink-0 h-5 w-5 rounded-full bg-moss-500 text-white text-[11px] font-semibold flex items-center justify-center"
                          x-text="n + 1"></span>
                    <div class="min-w-0 text-xs">
                      <p class="font-semibold text-ink" x-text="step.title"></p>
                      <template x-if="step.detail">
                        <p class="text-ink/70 break-words" x-text="step.detail"></p>
                      </template>
                      <template x-if="step.details">
                        <ul class="list-disc pl-4 text-ink/70 break-words">
                          <template x-for="(line, j) in step.details" :key="j">
                            <li x-text="line"></li>
                          </template>
                        </ul>
                      </template>
                    </div>
                  </li>
                </template>
              </ol>
              <div class="flex gap-1.5">
                <button type="button" x-on:click="$store.dashboard.applyAdvice(m)"
                        x-bind:disabled="$store.dashboard.drawerSaving"
                        x-bind:class="m.applied ? 'text-ink/60 border-line' : 'text-moss-700 border-moss-500 hover:bg-moss-tint'"
                        class="flex-1 text-sm font-medium bg-white border rounded-lg py-1.5 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-1.5">
                  <i class="ti text-base" x-bind:class="m.applied ? 'ti-check' : 'ti-wand'" aria-hidden="true"></i>
                  <span x-text="m.applied ? 'Guardado · aplicar de nuevo' : 'Aplicar y guardar'"></span>
                </button>
                <button type="button" x-show="m.undo" x-cloak x-on:click="$store.dashboard.undoAdvice(m)"
                        x-bind:disabled="$store.dashboard.drawerSaving"
                        title="Vuelve el widget a como estaba antes de aplicar"
                        class="text-sm font-medium text-ink/70 bg-white border border-line hover:bg-paper rounded-lg px-3 py-1.5 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5">
                  <i class="ti ti-arrow-back-up text-base" aria-hidden="true"></i>
                  Deshacer
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Nuevo mensaje: Enter envía, Mayús+Enter salta de línea -->
    <textarea x-model="$store.dashboard.drawerDraft.prompt" rows="2"
              x-on:keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); $store.dashboard.askAssistant() }"
              x-bind:placeholder="$store.dashboard.drawerThread.length ? 'Pide otro cambio…' : '¿Qué quieres ver o cambiar? (ej. ventas por categoría y año)'"
              class="w-full text-sm border border-line rounded-lg px-3 py-2 bg-white focus:outline-none focus:border-moss-500"></textarea>
    <div class="flex items-center gap-2">
      <button type="button" x-show="$store.dashboard.drawerThread.length" x-on:click="$store.dashboard.clearThread()"
              x-bind:disabled="$store.dashboard.drawerAsking"
              class="text-[11px] text-ink/50 hover:text-ink/80 disabled:opacity-40 cursor-pointer flex items-center gap-1">
        <i class="ti ti-message-plus text-sm" aria-hidden="true"></i> Nueva conversación
      </button>
      <button type="button" x-on:click="$store.dashboard.askAssistant()"
              x-bind:disabled="$store.dashboard.drawerAsking || !($store.dashboard.drawerDraft.prompt || '').trim()"
              class="ml-auto text-sm font-medium text-white bg-moss-500 hover:bg-moss-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg px-4 py-1.5 transition cursor-pointer flex items-center justify-center gap-1.5">
        <!-- Mientras la IA responde, el icono gira: no hace falta otro indicador en el hilo. -->
        <i class="ti text-base" aria-hidden="true"
           x-bind:class="$store.dashboard.drawerAsking ? 'ti-loader-2 animate-spin' : 'ti-send'"></i>
        Enviar
      </button>
    </div>
  </div>
</div>
