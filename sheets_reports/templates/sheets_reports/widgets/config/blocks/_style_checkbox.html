{# Casilla de un valor booleano de `style`. Parámetros: key, label. #}
<label class="flex items-center gap-2 text-xs font-semibold text-fg cursor-pointer">
  <input type="checkbox" x-model="$store.dashboard.drawerDraft.style.{{ key }}"
         class="h-4 w-4 rounded border-line text-accent-text focus:ring-accent">
  <span>{{ label }}</span>
</label>
