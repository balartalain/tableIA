{# Texto de `style`. Parámetros: key, label, placeholder (opcional). #}
<div>
  <label class="block text-xs font-semibold text-ink/70 mb-1">{{ label }}</label>
  <input type="text" x-model="$store.dashboard.drawerDraft.style.{{ key }}"
         placeholder="{{ placeholder|default:'' }}"
         class="w-full text-sm border border-line rounded-lg px-3 py-2 focus:outline-none focus:border-moss-500">
</div>
