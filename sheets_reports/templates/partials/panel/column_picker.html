{% comment %}
ui «column-picker» (TrendBy): una columna de la hoja, opcional. Del manifiesto: options y
empty_label (la opción «sin columna»).
{% endcomment %}
<select x-model="$store.dashboard.drawerDraft.builder[part.key]" x-bind:aria-label="part.label"
        class="w-full text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
  <option value="" x-text="part.empty_label"></option>
  <template x-for="f in $store.dashboard.pickerOptions(part)" :key="f">
    <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder[part.key]"></option>
  </template>
</select>
