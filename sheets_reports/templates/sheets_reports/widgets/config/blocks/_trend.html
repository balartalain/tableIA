<!-- Tendencia: la mini línea bajo el número, solo por columnas de tiempo -->
<div class="space-y-1">
  <label class="block text-xs font-semibold text-ink/70">Tendencia por</label>
  <template x-if="$store.dashboard.trendOptions.length">
    <select x-model="$store.dashboard.drawerDraft.fields.trend_by"
            class="w-full text-sm border border-line rounded-lg px-2 py-2 focus:outline-none focus:border-moss-500">
      <option value="" x-text="'Sin tendencia'"></option>
      <template x-for="f in $store.dashboard.trendOptions" :key="f">
        <option x-bind:value="f" x-text="f" x-bind:selected="$store.dashboard.drawerDraft.fields.trend_by === f"></option>
      </template>
    </select>
  </template>
  <p x-show="$store.dashboard.trendInvalid" class="text-[11px] text-clay-600">
    «<span x-text="$store.dashboard.drawerDraft.fields.trend_by"></span>» no es una columna de tiempo: la línea no
    mostraría una evolución. Elige otra o «Sin tendencia».
  </p>
  <p x-show="$store.dashboard.trendOptions.length" class="text-[11px] text-ink/50">
    Mini línea bajo el número: su evolución por esa columna de tiempo (año, mes, fecha…).
  </p>
  <p x-show="!$store.dashboard.trendOptions.length" class="text-[11px] text-ink/50">
    La hoja no tiene columnas de tiempo (año, mes, fecha…): sin ellas no hay tendencia.
  </p>
</div>
