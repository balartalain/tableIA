{% extends "base.html" %}
{% load static %}

{% block title %}{{ dashboard.nombre }} — Report IA{% endblock %}

{% block header %}
<header class="border-b border-line bg-header text-white">
  <div class="mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="font-sans font-semibold text-lg tracking-tight">{{ dashboard.nombre }}</span>
    </div>
  </div>
</header>
{% endblock %}

{% block content %}

<style>#dashboard-filters:empty { display: none; }</style>
<div class="mx-auto p-6">
  <!-- Caja de filtros: siempre arriba, fuera del grid; tan ancha como sus controles (con
       muchos, no pasa del ancho de la página y los controles bajan de línea). -->
  <div id="dashboard-filters" class="mb-4 w-fit max-w-full"></div>
  <div id="dashboard-canvas" class="grid grid-cols-12 gap-4">
  </div>
</div>

<script>
  window.DASHBOARD_ID = {{ dashboard.id }};
  window.REFRESH_MINUTES = {{ refresh_minutes|default:0 }};
</script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@6.4.0/dist/apexcharts.min.js"></script>
<link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
<link href="{% static 'sheets_reports/css/tabulator.css' %}" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.js"></script>

<script src="{% static 'sheets_reports/js/board_editor/base-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/utils/formatearEtiquetaApex.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widget-registry.js' %}"></script>

<script src="{% static 'sheets_reports/js/board_editor/widgets/bar-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/line-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/donut-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/kpi-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/dynamic-table-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/table-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/filter-widget.js' %}"></script>

<script src="{% static 'sheets_reports/js/board_editor/board-view-init.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/filters.js' %}"></script>

{% endblock %}
