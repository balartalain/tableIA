{# Paleta de colores de los gráficos (`style.color_scheme`). #}
<div>
  <label class="block text-xs font-semibold text-ink/70 mb-1">Paleta</label>
  <select x-vselect x-model="$store.dashboard.drawerDraft.style.color_scheme"
          class="w-full text-sm border border-line rounded-md px-3 py-2 focus:outline-none focus:border-moss-500">
    <option value="default">Verde Report IA (Por defecto)</option>
    <option value="multi">Multicolor</option>
  </select>
</div>
