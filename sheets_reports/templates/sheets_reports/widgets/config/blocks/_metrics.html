<!-- Métricas -->
<div class="space-y-2">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1">
      <label class="block text-xs font-semibold text-fg">Métricas</label>
      <button type="button" x-on:click="$store.help.open('metricas')" aria-label="Ayuda de métricas" title="¿Qué son las métricas?"
              class="p-0.5 rounded-full text-fg-muted hover:text-accent-text hover:bg-surface-muted cursor-pointer">
        <i class="ti ti-help-circle text-lg leading-none" aria-hidden="true"></i>
      </button>
    </div>
    <button type="button" x-on:click="$store.dashboard.addMetric()"
            x-bind:disabled="$store.dashboard.drawerDraft.fields.metrics.length >= $store.dashboard.metricsLimit"
            x-bind:title="$store.dashboard.metricsLimitedByPivot ? 'Con pivote, una sola métrica' : ''"
            class="text-xs font-medium text-accent-text hover:text-accent-text disabled:opacity-40 cursor-pointer flex items-center gap-1">
      <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar
    </button>
  </div>
  <p x-show="!$store.dashboard.drawerDraft.fields.metrics.length" class="text-xs text-fg-muted">
    Sin métricas: el widget lista las dimensiones tal cual.
  </p>
  <div class="space-y-1.5" data-column-list="metrics">
    <template x-for="(metric, idx) in $store.dashboard.drawerDraft.fields.metrics" :key="idx">
      <div class="flex gap-2 items-start rounded-lg bg-app border border-line p-2" data-column-row>
        <i class="ti ti-grip-vertical column-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-fg-subtle hover:text-fg-muted select-none mt-0.5"
           aria-hidden="true" title="Arrastra para reordenar"></i>
        <div class="flex-1 min-w-0 space-y-1.5">
          <div class="space-y-1.5">
            <select x-vselect x-model="metric.field" x-on:change="$store.dashboard.onMetricFieldChange(metric)" aria-label="Columna"
                    class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent">
              <template x-if="metric.agg === 'count'">
                <option value="">Todas las filas</option>
              </template>
              <template x-if="metric.agg !== 'count' && !metric.field">
                <option value="">— elegir —</option>
              </template>
              <template x-if="$store.dashboard.calculatedFieldNames.length">
                <optgroup label="Columnas">
                  <template x-for="col in $store.dashboard.sheetColumns" :key="col">
                    <option x-bind:value="col" x-text="col" x-bind:selected="metric.field === col"></option>
                  </template>
                </optgroup>
              </template>
              <template x-if="!$store.dashboard.calculatedFieldNames.length">
                <template x-for="col in $store.dashboard.sheetColumns" :key="col">
                  <option x-bind:value="col" x-text="col" x-bind:selected="metric.field === col"></option>
                </template>
              </template>
              <!-- Campos calculados (por fila y agregados) de la fuente -->
              <template x-if="$store.dashboard.calculatedFieldNames.length">
                <optgroup label="Campos calculados">
                  <template x-for="name in $store.dashboard.calculatedFieldNames" :key="name">
                    <option x-bind:value="name" x-text="name" x-bind:selected="metric.field === name"></option>
                  </template>
                </optgroup>
              </template>
            </select>
            <div class="flex gap-1.5">
              <select x-vselect x-model="metric.agg" x-on:change="$store.dashboard.onMetricFieldChange(metric)" aria-label="Agregación"
                      x-bind:disabled="metric.agg === 'auto'"
                      x-bind:title="metric.agg === 'auto' ? 'La agregación viene en la fórmula del campo calculado' : ''"
                      class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent disabled:bg-app disabled:text-fg-muted">
                <template x-for="o in $store.dashboard.metricAggOptions(metric)" :key="o.value">
                  <option x-bind:value="o.value" x-text="o.label" x-bind:selected="metric.agg === o.value"></option>
                </template>
              </select>
              <!-- Mostrar como: el valor tal cual o respecto a los demás (% del total de la columna, acumulado…). -->
              <template x-if="$store.dashboard.metricWindowOptions(metric).length">
                <div class="flex items-center gap-1 w-full">
                  <select x-vselect="(metric.window && metric.window.type) || ''" x-bind:value="(metric.window && metric.window.type) || ''"
                          x-on:change="$store.dashboard.setMetricWindow(metric, $event.target.value)"
                          aria-label="Mostrar como" title="Mostrar como"
                          class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent">
                    <template x-for="o in $store.dashboard.metricWindowOptions(metric)" :key="o.value">
                      <option x-bind:value="o.value"
                              x-text="'Mostrar: ' + o.label.charAt(0).toLowerCase() + o.label.slice(1)"
                              x-bind:selected="o.value === ((metric.window && metric.window.type) || '')"></option>
                    </template>
                  </select>
                  <button type="button" x-on:click="$store.help.open('mostrar-como')" aria-label="Ayuda de Mostrar como" title="¿Qué es «Mostrar como»?"
                          class="shrink-0 p-0.5 rounded-full text-fg-muted hover:text-accent-text hover:bg-surface-muted cursor-pointer">
                    <i class="ti ti-help-circle text-lg leading-none" aria-hidden="true"></i>
                  </button>
                </div>
              </template>
            </div>
            <!-- Formato: automático = el de la columna en la fuente (moneda, %) o el del campo calculado. -->
            <select x-vselect="metric.format || ''" x-bind:value="metric.format || ''"
                    x-on:change="$event.target.value ? metric.format = $event.target.value : delete metric.format"
                    aria-label="Formato" title="Cómo se muestran los valores de esta métrica"
                    class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent">
              <template x-for="o in $store.dashboard.metricFormatOptions" :key="o.value">
                <option x-bind:value="o.value" x-text="'Formato: ' + o.label"
                        x-bind:selected="o.value === (metric.format || '')"></option>
              </template>
            </select>

            <!-- Condiciones propias: la métrica resume solo esas filas (ej. ventas de Electrónica
                 junto al total). Plegable; abierto si ya trae condiciones. -->
            <template x-if="$store.dashboard.hasMetricFilters">
              <div x-data="{ open: (metric.filters || []).length > 0 }" class="rounded border border-line bg-surface">
                <button type="button" x-on:click="open = !open" x-bind:aria-expanded="open ? 'true' : 'false'"
                        class="w-full flex items-center gap-1.5 px-2 py-1 text-left cursor-pointer select-none">
                  <i class="ti ti-chevron-right text-xs text-fg-muted transition-transform" x-bind:class="open ? 'rotate-90' : ''" aria-hidden="true"></i>
                  <span class="text-xs font-semibold text-fg-muted">Solo filas donde…</span>
                  <span class="ml-auto min-w-0 truncate text-xs text-fg-muted"
                        x-text="(metric.filters || []).length ? (metric.filters.length === 1 ? '1 condición' : metric.filters.length + ' condiciones') : 'todas las filas'"></span>
                </button>
                <div x-show="open" class="space-y-1 border-t border-line p-1.5">
                  <template x-for="(c, ci) in metric.filters || []" :key="c._k">
                    {% include "sheets_reports/widgets/config/blocks/_condition_row.html" with list="metric.filters" %}
                  </template>
                  <button type="button" x-on:click="$store.dashboard.addMetricFilter(metric)"
                          x-bind:disabled="(metric.filters || []).length >= 20"
                          class="text-xs font-medium text-accent-text hover:text-accent-text disabled:opacity-40 cursor-pointer flex items-center gap-1">
                    <i class="ti ti-plus text-sm" aria-hidden="true"></i> Condición
                  </button>
                </div>
              </div>
            </template>
          </div>

        <input type="text" x-model="metric.label" aria-label="Nombre a mostrar"
               x-bind:title="'Se muestra: ' + $store.dashboard.metricName(metric)"
               x-bind:placeholder="$store.dashboard.metricName(metric)"
               class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent">
      </div>
      <button type="button" x-on:click="$store.dashboard.removeMetric(idx)"
              class="text-fg-muted hover:text-danger transition cursor-pointer px-1 text-base leading-none" title="Quitar métrica" aria-label="Quitar métrica">×</button>
    </div>
  </template>
  </div>

  <!-- Guías (una por bloque, no por métrica). -->
</div>
