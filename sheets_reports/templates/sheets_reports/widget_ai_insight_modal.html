{% comment %}
Ventana modal emergente con el análisis interpretativo del widget generado con IA (Markdown).
{% endcomment %}
<div x-data="widgetAiInsightModal()" x-cloak>
  <template x-teleport="body">
    <div x-show="open" 
         x-on:keydown.escape.window="open = false"
         class="fixed inset-0 z-50 bg-overlay backdrop-blur-xs flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">

      <div x-on:click.outside="open = false"
           role="dialog" aria-modal="true"
           class="bg-surface rounded-lg w-full max-w-xl max-h-[85vh] flex flex-col border border-line shadow-2xl overflow-hidden"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95 translate-y-2"
           x-transition:enter-end="opacity-100 scale-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 scale-100 translate-y-0"
           x-transition:leave-end="opacity-0 scale-95 translate-y-2">

        <!-- Cabecera -->
        <div class="px-5 py-3.5 bg-app border-b border-line flex items-center justify-between gap-3 shrink-0">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-9 h-9 rounded-lg bg-warning-bg text-warning flex items-center justify-center shrink-0">
              <i class="ti ti-bulb text-lg" aria-hidden="true"></i>
            </span>
            <div class="min-w-0">
              <h3 class="text-xs font-bold text-fg truncate" x-text="title || 'Análisis del gráfico'"></h3>
              <p class="text-xs text-fg-muted truncate">Interpretación analítica de los datos</p>
            </div>
          </div>

          <div class="flex items-center gap-1">
            <button type="button" x-show="insight && !loading" x-on:click="copy()"
                    x-bind:title="copied ? '¡Copiado!' : 'Copiar texto'"
                    x-bind:aria-label="copied ? '¡Copiado!' : 'Copiar texto'"
                    class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full transition cursor-pointer text-xs"
                    x-bind:class="copied ? 'text-success bg-success-bg font-medium' : 'text-fg-muted hover:text-fg hover:bg-surface-muted'">
              <i class="ti text-base" x-bind:class="copied ? 'ti-check text-success' : 'ti-copy'" aria-hidden="true"></i>
              <span x-show="copied" x-transition.opacity>¡Copiado!</span>
            </button>
            <button type="button" x-on:click="open = false"
                    title="Cerrar" aria-label="Cerrar"
                    class="p-1.5 rounded-full text-fg-muted hover:text-fg hover:bg-surface-muted transition cursor-pointer">
              <i class="ti ti-x text-base" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Contenido -->
        <div class="flex-1 min-h-0 overflow-y-auto p-5 text-xs text-fg leading-relaxed">
          <!-- Loader -->
          <div x-show="loading" class="py-12 flex flex-col items-center justify-center gap-3 text-center">
            <div class="w-10 h-10 rounded-lg bg-accent-soft text-accent-text flex items-center justify-center">
              <i class="ti ti-loader-2 text-xl animate-spin text-accent-text"></i>
            </div>
            <div class="space-y-1">
              <p class="font-semibold text-fg text-xs">Analizando datos del gráfico con IA…</p>
              <p class="text-xs text-fg-muted max-w-xs">Identificando tendencias, máximos, mínimos y conclusiones clave.</p>
            </div>
          </div>

          <!-- Error -->
          <div x-show="error && !loading" class="p-3 rounded-lg border border-danger bg-danger-bg text-danger space-y-1" role="alert">
            <p class="font-semibold flex items-center gap-1">
              <i class="ti ti-alert-circle"></i>
              <span>No se pudo generar el análisis</span>
            </p>
            <p x-text="error"></p>
            <button type="button" x-on:click="fetchInsight(widgetId, title)" class="mt-2 text-xs underline font-medium cursor-pointer">Reintentar</button>
          </div>

          <!-- Texto Markdown -->
          <div x-show="insight && !loading" class="prose prose-xs max-w-none text-fg leading-relaxed space-y-2" x-html="renderMarkdown(insight)"></div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function widgetAiInsightModal() {
  return {
    open: false,
    loading: false,
    error: '',
    title: '',
    widgetId: null,
    insight: '',
    copied: false,
    _copyTimer: null,

    init() {
      window.addEventListener('widget:ai-insight', (e) => {
        if (e.detail && e.detail.id) {
          this.fetchInsight(e.detail.id, e.detail.title);
        }
      });
    },

    async fetchInsight(widgetId, title) {
      this.widgetId = widgetId;
      this.title = title || '';
      this.open = true;
      this.loading = true;
      this.error = '';
      this.insight = '';
      this.copied = false;
      if (this._copyTimer) {
        clearTimeout(this._copyTimer);
        this._copyTimer = null;
      }

      try {
        const store = Alpine.store('dashboard');
        const qs = store && store.getFilterQueryString ? store.getFilterQueryString() : '';
        const url = apiUrl(`/api/widget/${widgetId}/ai-insight/` + (qs ? `?${qs}` : ''));

        const r = await fetch(url);
        const data = await r.json().catch(() => null);

        if (!r.ok || !data || data.error) {
          throw new Error((data && data.error) || `Error ${r.status}`);
        }

        this.insight = data.text || '';
      } catch (e) {
        this.error = e.message || 'Error al conectar con el servidor.';
      } finally {
        this.loading = false;
      }
    },

    renderMarkdown(text) {
      if (!text) return '';
      if (window.marked && typeof window.marked.parse === 'function') {
        try {
          return window.marked.parse(text);
        } catch (e) {}
      }
      return text.replace(/\n/g, '<br>');
    },

    copy() {
      if (this.insight && navigator.clipboard) {
        navigator.clipboard.writeText(this.insight);
        this.copied = true;
        if (this._copyTimer) clearTimeout(this._copyTimer);
        this._copyTimer = setTimeout(() => {
          this.copied = false;
        }, 2000);
        if (typeof window.showToast === 'function') {
          window.showToast('Análisis copiado al portapapeles');
        }
      }
    }
  };
}
</script>
