<!-- Pivotes: series / columnas cruzadas -->
<div class="space-y-2"{% if totals %}
     x-init="$store.dashboard.registerStyleGroup('Totales', ['showColumnTotals', 'columnSubtotal1'])"{% endif %}>
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1">
      <label class="block text-xs font-semibold text-fg">Pivotes</label>
      <button type="button" x-on:click="$store.help.open('pivotes')" aria-label="Ayuda de pivotes" title="¿Qué son los pivotes?"
              class="p-0.5 rounded-full text-fg-muted hover:text-accent-text hover:bg-surface-muted cursor-pointer">
        <i class="ti ti-help-circle text-lg leading-none" aria-hidden="true"></i>
      </button>
    </div>
    <button type="button" x-on:click="$store.dashboard.addPivot()"
            x-bind:disabled="$store.dashboard.drawerDraft.fields.pivots.length >= $store.dashboard.maxPivots || $store.dashboard.pivotsBlocked"
            x-bind:title="$store.dashboard.pivotsBlocked ? 'Con varias métricas no se puede pivotar: deja una' : ''"
            class="text-xs font-medium text-accent-text hover:text-accent-text disabled:opacity-40 cursor-pointer flex items-center gap-1">
      <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar
    </button>
  </div>
  <div class="space-y-1" data-column-list="pivots">
    <template x-for="(col, idx) in $store.dashboard.drawerDraft.fields.pivots" :key="'piv-' + idx">
      <div class="space-y-1" data-column-row>
        <div class="flex gap-1.5 items-center rounded-lg bg-app border border-line p-1.5">
          <i class="ti ti-grip-vertical column-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-fg-subtle hover:text-fg-muted select-none"
             aria-hidden="true" title="Arrastra para reordenar"></i>
          <select x-vselect x-model="$store.dashboard.drawerDraft.fields.pivots[idx]"
                  aria-label="Pivote"
                  class="flex-1 min-w-0 text-xs border border-line rounded-md px-1.5 py-1 bg-surface focus:outline-none focus:border-accent">
            <option value="" x-show="!col" x-text="'— elegir —'"></option>
            <template x-for="c in $store.dashboard.pivotOptions(idx)" :key="c">
              <option x-bind:value="c" x-text="c"></option>
            </template>
            <!-- Virtuales de las cuadrículas del formulario (Aspecto, Respuesta) -->
            <template x-if="$store.dashboard.gridOptions($store.dashboard.drawerDraft.fields.pivots, idx).length">
              <optgroup label="Cuadrículas">
                <template x-for="c in $store.dashboard.gridOptions($store.dashboard.drawerDraft.fields.pivots, idx)" :key="'grid-' + c">
                  <option x-bind:value="c" x-text="c"></option>
                </template>
              </optgroup>
            </template>
          </select>
          <button type="button" x-on:click="$store.dashboard.removePivot(idx)"
                  class="text-fg-muted hover:text-danger transition cursor-pointer px-1 text-base leading-none"
                  title="Quitar pivote" aria-label="Quitar pivote">×</button>
        </div>
        {% if totals %}
        <!-- Totales de cada nivel de columnas: 0 = total general, 1 = subtotales. -->
        <template x-if="col && idx < 2">
          <label class="flex items-center gap-1.5 pl-1.5 text-xs text-fg-muted cursor-pointer"
                 x-bind:title="idx === 0 ? 'Columna «Total general» a la derecha de la tabla'
                               : 'Subtotal «Total …» de cada ' + ($store.dashboard.drawerDraft.fields.pivots[idx - 1] || 'grupo')">
            <input type="checkbox"
                   x-model="$store.dashboard.drawerDraft.style[['showColumnTotals', 'columnSubtotal1'][idx]]"
                   class="h-3.5 w-3.5 rounded border-line text-accent-text focus:ring-accent">
            Mostrar totales
          </label>
        </template>
        {% endif %}
      </div>
    </template>
  </div>
  <p class="text-xs text-fg-muted">Desagregación extra: series en el gráfico, columnas en la tabla dinámica.</p>
</div>
