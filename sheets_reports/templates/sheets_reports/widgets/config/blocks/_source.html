<!-- Fuente de datos del widget: cambiarla carga las columnas de esa hoja. -->
<div>
  <label class="block text-xs font-semibold text-fg mb-1" for="drawer-source">Fuente de datos</label>
  <select x-vselect="$store.dashboard.drawerDraft.source ?? ''" id="drawer-source"
          x-bind:value="$store.dashboard.drawerDraft.source ?? ''"
          x-on:change="$store.dashboard.changeDrawerSource($event.target.value)"
          class="w-full text-sm border border-line rounded-md px-3 py-2 bg-surface focus:outline-none focus:border-accent">
    <option value="" x-bind:selected="!$store.dashboard.drawerDraft.source">— elegir —</option>
    <template x-for="s in $store.dashboard.sources" :key="s.id">
      <option x-bind:value="s.id" x-text="s.label" x-bind:selected="$store.dashboard.drawerDraft.source === s.id"></option>
    </template>
  </select>
</div>
