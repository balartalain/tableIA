<!-- Métricas -->
<div class="space-y-2">
  <div class="flex items-center justify-between">
    <label class="block text-xs font-semibold text-ink/70">Métricas</label>
    <button type="button" x-on:click="$store.dashboard.addMetric()"
            x-bind:disabled="$store.dashboard.drawerDraft.fields.metrics.length >= $store.dashboard.maxMetrics"
            class="text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 cursor-pointer flex items-center gap-1">
      <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar
    </button>
  </div>
  <p x-show="!$store.dashboard.drawerDraft.fields.metrics.length" class="text-[11px] text-ink/50">
    Sin métricas: el widget lista las dimensiones tal cual.
  </p>
  <div class="space-y-1.5" data-column-list="metrics">
    <template x-for="(metric, idx) in $store.dashboard.drawerDraft.fields.metrics" :key="idx">
      <div class="flex gap-2 items-start rounded-lg bg-paper/70 border border-line/60 p-2" data-column-row>
        <i class="ti ti-grip-vertical column-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-ink/30 hover:text-ink/60 select-none mt-0.5"
           aria-hidden="true" title="Arrastra para reordenar"></i>
        <div class="flex-1 min-w-0 space-y-1.5">
        <!-- Agregación o cálculo entre métricas -->
        <select x-show="$store.dashboard.hasFormulaMetrics"
                x-bind:value="metric.type || 'agg'"
                x-on:change="$store.dashboard.onMetricTypeChange(idx, $event.target.value)"
                aria-label="Tipo de métrica"
                class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
          <template x-for="o in $store.dashboard.metricTypeOptions" :key="o.value">
            <option x-bind:value="o.value" x-text="o.label"></option>
          </template>
        </select>

        <template x-if="(metric.type || 'agg') !== 'formula'">
          <div class="space-y-1.5">
            <select x-model="metric.field" x-on:change="$store.dashboard.onMetricFieldChange(metric)" aria-label="Columna"
                    class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
              <option value="" x-show="metric.agg === 'count' || !metric.field" x-text="metric.agg === 'count' ? 'Todas las filas' : '— elegir —'"></option>
              <template x-for="col in $store.dashboard.schema.all_fields || []" :key="col">
                <option x-bind:value="col" x-text="col"></option>
              </template>
            </select>
            <div class="flex gap-1.5">
              <select x-model="metric.agg" x-on:change="$store.dashboard.onMetricFieldChange(metric)" aria-label="Agregación"
                      class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                <template x-for="o in $store.dashboard.aggOptions" :key="o.value">
                  <option x-bind:value="o.value" x-text="o.label"></option>
                </template>
              </select>
              <!-- Mostrar como: el valor tal cual o respecto a los demás (% del total de la columna, acumulado…). -->
              <template x-if="$store.dashboard.metricWindowOptions.length">
                <select x-bind:value="(metric.window && metric.window.type) || ''"
                        x-on:change="$store.dashboard.setMetricWindow(metric, $event.target.value)"
                        aria-label="Mostrar como" title="Mostrar como"
                        class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                  <template x-for="o in $store.dashboard.metricWindowOptions" :key="o.value">
                    <option x-bind:value="o.value"
                            x-text="'Mostrar: ' + o.label.charAt(0).toLowerCase() + o.label.slice(1)"
                            x-bind:selected="o.value === ((metric.window && metric.window.type) || '')"></option>
                  </template>
                </select>
              </template>
            </div>
            <p x-show="$store.dashboard.metricWindowInvalid(metric)" class="text-[11px] text-clay-600">
              «Mostrar como» no aplica con esta configuración: se quitará al guardar.
            </p>

            <!-- Condiciones propias: la métrica resume solo esas filas (ej. ventas de Electrónica
                 junto al total). Plegable; abierto si ya trae condiciones. -->
            <template x-if="$store.dashboard.hasMetricFilters">
              <div x-data="{ open: (metric.filters || []).length > 0 }" class="rounded-md border border-line/60 bg-white/70">
                <button type="button" x-on:click="open = !open" x-bind:aria-expanded="open ? 'true' : 'false'"
                        class="w-full flex items-center gap-1.5 px-2 py-1 text-left cursor-pointer select-none">
                  <i class="ti ti-chevron-right text-xs text-ink/50 transition-transform" x-bind:class="open ? 'rotate-90' : ''" aria-hidden="true"></i>
                  <span class="text-[11px] font-semibold text-ink/60">Solo filas donde…</span>
                  <span class="ml-auto min-w-0 truncate text-[11px] text-ink/45"
                        x-text="(metric.filters || []).length ? (metric.filters.length === 1 ? '1 condición' : metric.filters.length + ' condiciones') : 'todas las filas'"></span>
                </button>
                <div x-show="open" class="space-y-1 border-t border-line/60 p-1.5">
                  <template x-for="(c, ci) in metric.filters || []" :key="c._k">
                    {% include "sheets_reports/widgets/config/blocks/_condition_row.html" with list="metric.filters" %}
                  </template>
                  <button type="button" x-on:click="$store.dashboard.addMetricFilter(metric)"
                          x-bind:disabled="(metric.filters || []).length >= 20"
                          class="text-[11px] font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 cursor-pointer flex items-center gap-1">
                    <i class="ti ti-plus text-sm" aria-hidden="true"></i> Condición
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Cálculo entre las métricas anteriores -->
        <template x-if="metric.type === 'formula' && metric.op">
          <div class="space-y-1.5">
            <p x-show="!$store.dashboard.formulaOperandOptions(idx).length" class="text-[11px] text-clay-600">
              Agrega antes las métricas con las que quieres calcular.
            </p>
            <div class="flex flex-wrap items-center gap-1.5">
              <select x-model="metric.left" x-on:change="$store.dashboard.onFormulaChange(idx)"
                      aria-label="Primera métrica"
                      class="flex-1 min-w-[6.5rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                <option value="">Elige una métrica…</option>
                <template x-for="o in $store.dashboard.formulaOperandOptions(idx)" :key="o.value">
                  <option x-bind:value="o.value" x-text="o.label"></option>
                </template>
              </select>
              <select x-model="metric.op" x-on:change="$store.dashboard.onFormulaChange(idx)"
                      aria-label="Operación"
                      class="w-32 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                <template x-for="o in $store.dashboard.calcOpOptions" :key="o.value">
                  <option x-bind:value="o.value" x-text="o.label"></option>
                </template>
              </select>
              <select x-model="metric.rightKind" x-on:change="$store.dashboard.onFormulaChange(idx)"
                      aria-label="Operar con"
                      class="w-24 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                <option value="metric">métrica</option>
                <option value="number">número</option>
              </select>
              <template x-if="(metric.rightKind || 'number') !== 'number'">
                <select x-model="metric.right" x-on:change="$store.dashboard.onFormulaChange(idx)"
                        aria-label="Segunda métrica"
                        class="flex-1 min-w-[6.5rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                  <option value="">Elige una métrica…</option>
                  <template x-for="o in $store.dashboard.formulaOperandOptions(idx)" :key="o.value">
                    <option x-bind:value="o.value" x-text="o.label"></option>
                  </template>
                </select>
              </template>
              <template x-if="(metric.rightKind || 'number') === 'number'">
                <input type="text" x-model="metric.right" x-on:input="$store.dashboard.onFormulaChange(idx)"
                       placeholder="Número" aria-label="Número"
                       class="w-24 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
              </template>
            </div>
            <p x-show="!metric.expression" class="text-[11px] text-clay-600">
              Cálculo incompleto: se descarta si guardas así.
            </p>
          </div>
        </template>

        <!-- Fórmula personalizada (ej. de la IA) que no encaja en una operación del panel:
             se muestra y se guarda tal cual. -->
        <template x-if="metric.type === 'formula' && !metric.op">
          <div class="space-y-1">
            <code class="block w-full break-words rounded-md border border-line bg-white px-1.5 py-1 font-mono text-[11px] text-ink/80"
                  x-text="metric.expression"></code>
            <p class="text-[11px] text-ink/50">
              Fórmula personalizada: para cambiarla, pídeselo a la IA o
              <button type="button" x-on:click="$store.dashboard.editFormulaWithSelects(idx)"
                      class="font-medium text-moss-700 hover:text-moss-800 underline cursor-pointer">elige una operación</button>.
            </p>
          </div>
        </template>

        <input type="text" x-model="metric.label" aria-label="Nombre a mostrar"
               x-bind:title="'Se muestra: ' + $store.dashboard.metricName(metric)"
               x-bind:placeholder="$store.dashboard.metricName(metric)"
               class="w-full text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
      </div>
      <button type="button" x-on:click="$store.dashboard.removeMetric(idx)"
              class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none" title="Quitar métrica" aria-label="Quitar métrica">×</button>
    </div>
  </template>
  </div>
</div>
