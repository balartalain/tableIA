{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Prefijo bajo el que corre la app (ej. "/sheets-reports" en producción, "" en dev).
  // Usar apiUrl() para toda llamada fetch a /api/... en vez de hardcodear el "/" inicial.
  window.SCRIPT_NAME = "{{ request.META.SCRIPT_NAME }}";
  window.apiUrl = (path) => window.SCRIPT_NAME + path;
</script>
<title>{% block title %}Report IA{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{% static 'sheets_reports/img/favicon.svg' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'sheets_reports/img/favicon-32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'sheets_reports/img/favicon-16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'sheets_reports/img/apple-touch-icon-180.png' %}">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: 'var(--color-ink)',
          paper: 'var(--color-paper)',
          header: 'var(--color-header)',
          line: 'var(--color-line)',
          moss: {
            50: 'var(--color-moss-50)', 100: 'var(--color-moss-100)', 300: 'var(--color-moss-300)',
            500: 'var(--color-moss-500)', 600: 'var(--color-moss-600)', 700: 'var(--color-moss-700)',
            tint: 'var(--color-moss-tint)',
          },
          clay: {
            50: 'var(--color-clay-50)', 300: 'var(--color-clay-300)',
            500: 'var(--color-clay-500)', 600: 'var(--color-clay-600)',
          },
        }
      }
    }
  }
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<style>
  :root {
    --color-ink: #14171F;
    --color-paper: #F7F8F4;
    --color-header: #003876;
    --color-line: #E3E5DE;
    --color-moss-50: #EAF3EC;
    --color-moss-100: #CFE6D6;
    --color-moss-300: #6FAE86;
    --color-moss-500: #1F8A5F;
    --color-moss-600: #166B49;
    --color-moss-700: #0F5138;
    --color-moss-tint: color-mix(in srgb, var(--color-moss-500) 10%, white);
    --color-clay-50: #FBF3EA;
    --color-clay-300: #E0AF77;
    --color-clay-500: #B5793D;
    --color-clay-600: #8F5E2E;
  }
  [x-cloak] { display: none !important; }
  /* Selects de la caja de filtros (Virtual Select): el botón como un control, la lista como un contenedor. */
  .vscomp-toggle-button { border-radius: 0.375rem; }
  .vscomp-dropbox { border-radius: 0.25rem; overflow: hidden; }
</style>
</head>
<body class="bg-paper text-ink antialiased min-h-screen">

{% block header %}
<!-- Header compartido: cada página llena sus bloques (el editor agrega salir, el nombre del
     tablero y sus acciones; el home usa los valores por defecto). -->
<header id="app-header" class="border-b border-line bg-white">
  <div class="h-14 px-4 flex items-center gap-3">
    {% block header_leading %}{% endblock %}
    <span class="shrink-0 w-7 h-7 rounded-md bg-moss-500 flex items-center justify-center text-white text-sm font-sans font-bold" aria-hidden="true">R</span>
    <div class="min-w-0 flex-1 flex items-center">
      {% block header_title %}<span class="font-sans font-semibold text-base tracking-tight">Tableros IA</span>{% endblock %}
    </div>
    <div class="shrink-0 flex items-center gap-2">
      {% block header_actions %}{% endblock %}
      <div class="w-8 h-8 rounded-full bg-moss-50 border border-moss-100 flex items-center justify-center text-xs font-medium text-moss-700"
           title="Usuario" aria-label="Usuario">RA</div>
    </div>
  </div>
</header>
{% endblock %}

{% block content %}{% endblock %}

<script src="{% static 'sheets_reports/js/board_editor/utils/formatearEtiquetaApex.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>
</html>
