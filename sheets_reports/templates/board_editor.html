{% extends "base.html" %}
{% load static %}

{% block title %}{{ dashboard.nombre }} — Editor de tablero{% endblock %}

{% block header_actions %}
<button onclick="window.location.href='{% url 'home' %}'" class="bg-white border border-line hover:bg-paper text-ink/70 py-2 px-4 rounded-xl font-medium text-sm transition cursor-pointer flex items-center gap-1.5">
  <i class="ti ti-logout" aria-hidden="true"></i>
  Salir del editor
</button>
<button id="share-btn" class="bg-white border border-line hover:bg-paper text-ink/70 py-2 px-4 rounded-xl font-medium text-sm transition cursor-pointer">
  Compartir
</button>
{% endblock %}

{% block content %}

<style>
  #dashboard-filters:empty { display: none; }
  #dashboard-canvas {
    background-origin: content-box;
    background-image: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent calc(100% / 12),
        rgba(148, 163, 184, 0.07) calc(100% / 12),
        rgba(148, 163, 184, 0.07) calc(100% / 12 * 2)
    );
  }
  .is-snapping { transition: height 0.16s ease-out; }
  /* Fantasma de la métrica o columna que se está arrastrando dentro del panel de edición. */
  .metric-ghost-preview {
    background-color: #f1f5f9 !important;
    opacity: 0.6;
    border-radius: 0.375rem;
  }
  .grid-ghost-preview {
    background-color: #f1f5f9 !important;
    border: 2px dashed #cbd5e1 !important;
    border-radius: 0.75rem;
    opacity: 0.5;
    min-height: 10px !important;
    grid-column: span var(--ghost-span, 6) / span var(--ghost-span, 6) !important;
  }
  /* Sticky la ancla solo en vertical; en horizontal se desplaza junto a las columnas.
     El ancho en px lo copia setupColumnRulerSync del lienzo, así sus 12 pistas miden
     exactamente lo mismo que las del grid de abajo. */
  .grid-numbers-header {
    position: sticky;
    top: 0;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 1rem;
    /* Mismo padding que el p-4 del lienzo: las pistas miden (ancho - 32px) con los mismos
       gutters, así que cada número cae en el centro de su columna. */
    padding: 0 16px;
    pointer-events: none;
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    line-height: 24px;
    color: rgba(239, 68, 68, 0.8);
    background: rgba(255, 255, 255, 0.9);
    border-bottom: 1px dashed rgba(239, 68, 68, 0.4);
    text-align: center;
  }
  /* El header real mide 4rem + el 1px de su border-b, así que en vez de calcularlo
     con un calc se deja que flexbox mida el header de verdad. */
  html body {
    height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #board-body {
    flex: 1 1 auto;
    min-height: 0;
  }

  /* Barra de módulos: expandida (248px) o contraída a una tira de íconos (56px). El estado
    cuelga de html[data-rail] (lo pone el script en línea antes del <aside>). */
  #module-rail { width: 248px; }
  #module-rail [hidden] { display: none !important; }  /* las filas son flex: [hidden] debe ganar */
  #module-rail.rail-animated { transition: width 160ms ease; }
  #module-rail .rail-chevron { transition: transform 160ms ease; }
  html[data-rail="collapsed"] #module-rail { width: 56px; }
  html[data-rail="collapsed"] #module-rail .rail-body { padding-left: 0.5rem; padding-right: 0.5rem; }
  html[data-rail="collapsed"] #module-rail .rail-header,
  html[data-rail="collapsed"] #module-rail .rail-search,
  html[data-rail="collapsed"] #module-rail .rail-group,
  html[data-rail="collapsed"] #module-rail .rail-empty,
  html[data-rail="collapsed"] #module-rail .rail-text { display: none; }
  html[data-rail="collapsed"] #module-rail .rail-item {
    justify-content: center; padding: 0.25rem 0; border-color: transparent; background: transparent;
  }
  html[data-rail="collapsed"] #module-rail .rail-item:hover .rail-icon { border-color: #cbd5e1; color: #14171f; }
  html[data-rail="collapsed"] #module-rail .rail-chevron { transform: rotate(180deg); }
</style>

<div id="board-body" class="flex w-full overflow-hidden">

  <script>
    // Antes de pintar la barra: si quedó contraída, se dibuja contraída desde el primer frame.
    try {
      if (localStorage.getItem('tableia:rail-collapsed') === '1') document.documentElement.dataset.rail = 'collapsed';
    } catch (e) {}
  </script>
  <aside id="module-rail" class="relative shrink-0 bg-white border-r border-line shadow-sm z-10">
    <div class="rail-body h-full overflow-y-auto overflow-x-hidden px-4 py-5">
      <div class="rail-header mb-4">
        <h2 class="text-base font-bold text-ink whitespace-nowrap">Módulos</h2>
        <p class="text-xs text-ink/50 mt-1">Arrastra un módulo al lienzo.</p>
      </div>

      <label class="rail-search relative block mb-4">
        <span class="sr-only">Buscar módulo</span>
        <i class="ti ti-search absolute left-2.5 top-1/2 -translate-y-1/2 text-sm text-ink/40" aria-hidden="true"></i>
        <input id="rail-search" type="search" placeholder="Buscar módulo…" autocomplete="off"
               class="w-full text-sm border border-line rounded-lg pl-8 pr-2 py-1.5 focus:outline-none focus:border-moss-500">
      </label>

      <div id="sidebar-components"></div>
    </div>

    <button id="rail-toggle" type="button" aria-controls="module-rail" aria-expanded="true"
            aria-label="Contraer panel" title="Contraer panel"
            class="absolute top-5 -right-[11px] z-20 w-[22px] h-[22px] rounded-full bg-white border border-line shadow-sm text-ink/60 hover:text-ink flex items-center justify-center cursor-pointer">
      <i class="rail-chevron ti ti-chevron-left text-xs" aria-hidden="true"></i>
    </button>
  </aside>

  <main id="board-main" class="relative flex-1 min-w-0 min-h-0 overflow-hidden">
    <div id="board-scroll" class="h-full w-full overflow-auto flex flex-col">
      <div class="grid-numbers-header">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
        <span>7</span>
        <span>8</span>
        <span>9</span>
        <span>10</span>
        <span>11</span>
        <span>12</span>
      </div>
      <!-- Caja de filtros (widgets con placement 'header'): arriba del grid, bajo la regla. -->
      <div id="dashboard-filters" class="bg-paper px-4 pt-4"></div>
      <div id="dashboard-canvas" class="grid grid-cols-12 gap-4 content-start flex-1 bg-paper p-4">
      </div>
    </div>
  </main>

  <aside id="edit-drawer" x-data
         x-bind:class="$store.dashboard.editingId ? 'w-[34rem] border-l' : 'w-0 border-l-0'"
         x-bind:inert="!$store.dashboard.editingId"
         class="shrink-0 h-full bg-white border-line overflow-hidden transition-[width] duration-300">
  <div class="w-[34rem] h-full flex flex-col">
    <div class="flex justify-between items-center px-5 py-4 border-b border-line">
      <h3 class="text-sm font-bold text-ink">Editar Propiedades</h3>
      <button x-on:click="$store.dashboard.closeDrawer()" class="text-ink/40 hover:text-ink transition cursor-pointer text-sm">✕</button>
    </div>

    <div role="tablist" class="flex gap-4 px-5 border-b border-line">
      <template x-for="tab in [{ id: 'data', label: 'Configurar', icon: 'ti-table' }, { id: 'style', label: 'Personalizar', icon: 'ti-palette' }]" :key="tab.id">
        <button type="button" role="tab" x-on:click="$store.dashboard.drawerTab = tab.id"
                x-bind:aria-selected="$store.dashboard.drawerTab === tab.id"
                x-bind:class="$store.dashboard.drawerTab === tab.id ? 'border-moss-500 text-moss-600' : 'border-transparent text-ink/50 hover:text-ink'"
                class="-mb-px flex items-center gap-1.5 border-b-2 py-2.5 text-sm font-medium transition cursor-pointer">
          <i class="ti text-base" x-bind:class="tab.icon" aria-hidden="true"></i>
          <span x-text="tab.label"></span>
        </button>
      </template>
    </div>

    <div class="flex-1 min-h-0 overflow-y-auto p-5">

    <div x-show="$store.dashboard.drawerSpecError" x-cloak role="alert"
         class="mb-4 flex items-start gap-2 rounded-lg border border-clay-300 bg-clay-50 px-3 py-2 text-xs text-clay-600">
      <i class="ti ti-alert-triangle text-sm mt-px" aria-hidden="true"></i>
      <span x-text="$store.dashboard.drawerSpecError"></span>
    </div>

    <div class="grid grid-cols-2 gap-x-3 gap-y-4">
      <template x-for="field in $store.dashboard.drawerFields" :key="field.key">
        <template x-if="field.type !== 'builder' || $store.dashboard.drawerDraft.builder">
          <div x-show="(field.tab || 'style') === $store.dashboard.drawerTab"
               x-bind:class="(field.key === 'title' || field.type === 'assistant' || field.type === 'builder') ? 'col-span-2' : 'col-span-1'">
            <template x-if="field.type !== 'assistant' && field.type !== 'builder'">
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-semibold text-ink/70" x-text="field.label"></label>
              </div>
            </template>

            <template x-if="field.type === 'text'">
              <input type="text" x-model="$store.dashboard.drawerDraft[field.key]"
                     x-bind:readonly="!!field.readonly"
                     x-bind:class="field.readonly ? 'bg-paper text-ink/50 cursor-not-allowed' : ''"
                     class="w-full text-sm border border-line rounded-lg px-3 py-2 focus:outline-none focus:border-moss-500">
            </template>

            <template x-if="field.type === 'assistant'">
              <div class="rounded-xl border border-moss-100 bg-moss-tint px-3 py-2">
                <button type="button" x-on:click="$store.dashboard.drawerAskOpen = !$store.dashboard.drawerAskOpen"
                        x-bind:aria-expanded="$store.dashboard.drawerAskOpen"
                        class="w-full flex items-center justify-between text-xs font-semibold text-moss-700 cursor-pointer">
                  <span class="flex items-center gap-1.5">
                    <i class="ti ti-sparkles text-sm" aria-hidden="true"></i>
                    <span x-text="field.label"></span>
                  </span>
                  <i class="ti text-sm" x-bind:class="$store.dashboard.drawerAskOpen ? 'ti-chevron-up' : 'ti-chevron-down'" aria-hidden="true"></i>
                </button>
                <div x-show="$store.dashboard.drawerAskOpen" x-cloak class="mt-2 space-y-2">
                <p class="text-[11px] text-ink/60">Describe qué quieres ver y la IA te dirá cómo configurarlo en el constructor.</p>
                <textarea x-model="$store.dashboard.drawerDraft[field.key]" rows="3"
                          x-on:keydown.ctrl.enter="$store.dashboard.askAssistant()"
                          placeholder="¿Qué quieres ver? (ej. ventas por categoría y año, separadas por cajero)"
                          class="w-full text-sm border border-line rounded-lg px-3 py-2 bg-white focus:outline-none focus:border-moss-500"></textarea>
                <button type="button" x-on:click="$store.dashboard.askAssistant()"
                        x-bind:disabled="$store.dashboard.drawerAsking || !($store.dashboard.drawerDraft[field.key] || '').trim()"
                        class="w-full text-sm font-medium text-white bg-moss-500 hover:bg-moss-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg py-2 transition cursor-pointer flex items-center justify-center gap-1.5">
                  <i class="ti text-base" x-bind:class="$store.dashboard.drawerAsking ? 'ti-loader-2 animate-spin' : 'ti-message-question'" aria-hidden="true"></i>
                  <span x-text="$store.dashboard.drawerAsking ? 'Consultando…' : 'Consultar'"></span>
                </button>
                <p x-show="$store.dashboard.drawerAskError" x-text="$store.dashboard.drawerAskError"
                   class="text-xs text-red-600"></p>

                <template x-if="$store.dashboard.drawerSteps.length">
                  <div class="rounded-lg border border-line bg-white p-3 space-y-3">
                    <p class="text-xs font-semibold text-ink/70">Sigue estos pasos en el constructor:</p>
                    <ol class="space-y-2">
                      <template x-for="(step, n) in $store.dashboard.drawerSteps" :key="step.title">
                        <li class="flex gap-2">
                          <span class="shrink-0 h-5 w-5 rounded-full bg-moss-500 text-white text-[11px] font-semibold flex items-center justify-center"
                                x-text="n + 1"></span>
                          <div class="min-w-0 text-xs">
                            <p class="font-semibold text-ink" x-text="step.title"></p>
                            <template x-if="step.detail">
                              <p class="text-ink/70" x-text="step.detail"></p>
                            </template>
                            <template x-if="step.details">
                              <ul class="list-disc pl-4 text-ink/70">
                                <template x-for="(line, j) in step.details" :key="j">
                                  <li x-text="line"></li>
                                </template>
                              </ul>
                            </template>
                          </div>
                        </li>
                      </template>
                    </ol>
                    <button type="button" x-on:click="$store.dashboard.applyAdvice()"
                            class="w-full text-sm font-medium text-moss-700 bg-white border border-moss-500 hover:bg-moss-tint rounded-lg py-1.5 transition cursor-pointer flex items-center justify-center gap-1.5">
                      <i class="ti ti-wand text-base" aria-hidden="true"></i>
                      Aplicar pasos
                    </button>
                    <p class="text-[11px] text-ink/50">Rellena el constructor con esta configuración; revisa y pulsa «Guardar».</p>
                  </div>
                </template>
                </div>
              </div>
            </template>

            <template x-if="field.type === 'builder'">
              <div class="space-y-3">
                <p x-show="$store.dashboard.schemaError" x-text="$store.dashboard.schemaError" class="text-[11px] text-red-600"></p>
                <p x-show="!$store.dashboard.schemaError && !($store.dashboard.schema.all_fields || []).length" class="text-[11px] text-ink/50">
                  Cargando columnas de la hoja…
                </p>

                <!-- Agrupar datos: qué filas y qué columnas forman la tabla. El KPI es un único
                     total: no agrupa. La tabla admite varios niveles anidados, como una tabla
                     dinámica de Sheets. -->
                <div class="space-y-2" x-show="$store.dashboard.drawerWidgetClass.supportsDimension">
                  <div class="flex items-center gap-2">
                    <h3 class="text-[11px] font-semibold uppercase tracking-wide text-ink/60">Agrupar datos</h3>
                    <p class="text-[11px] text-ink/40">qué filas y qué columnas de la hoja se usan</p>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[11px] font-semibold text-ink/60 mb-1" x-text="$store.dashboard.dimensionLabel"></label>
                    <div class="space-y-1">
                      <template x-for="(d, i) in $store.dashboard.drawerDraft.builder.dimensions" :key="'dim-' + i">
                        <div class="space-y-1">
                        <div class="flex items-center gap-1">
                          <select x-model="$store.dashboard.drawerDraft.builder.dimensions[i]" x-on:change="$store.dashboard.onDimensionChange()"
                                  class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                            <option value="" x-show="!$store.dashboard.drawerDraft.builder.dimensions[i]">Elige una columna…</option>
                            <template x-for="f in $store.dashboard.dimensionOptionsAt(i)" :key="f">
                              <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder.dimensions[i]"></option>
                            </template>
                          </select>
                          <button type="button" x-show="$store.dashboard.drawerDraft.builder.dimensions.length > 1" x-on:click="$store.dashboard.removeDimension(i)"
                                  class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none"
                                  title="Quitar nivel" aria-label="Quitar nivel de filas">×</button>
                        </div>
                        <template x-if="$store.dashboard.drawerDraft.rowTotals">
                          <label class="flex items-center gap-1.5 pl-1 text-[11px] text-ink/60 cursor-pointer"
                                 x-bind:title="i === 0 ? 'Fila «Total general» al pie de la tabla' : `Subtotal «Total …» de cada ${$store.dashboard.drawerDraft.builder.dimensions[i - 1] || 'grupo'}`">
                            <input type="checkbox" x-model="$store.dashboard.drawerDraft.rowTotals[i]"
                                   class="h-3.5 w-3.5 rounded border-line text-moss-600 focus:ring-moss-500">
                            Mostrar totales
                          </label>
                        </template>
                        <template x-if="i === 0 && $store.dashboard.drawerDraft.rowTotals">
                          <label class="flex items-center gap-1.5 pl-1 text-[11px] text-ink/60 cursor-pointer"
                                 title="Repite la etiqueta de cada nivel en todas sus filas en vez de dejarla en blanco">
                            <input type="checkbox" x-model="$store.dashboard.drawerDraft.repeatRowLabels"
                                   class="h-3.5 w-3.5 rounded border-line text-moss-600 focus:ring-moss-500">
                            Repetir etiquetas de fila
                          </label>
                        </template>
                        </div>
                      </template>
                    </div>
                    <button type="button" x-show="$store.dashboard.maxDimensions > 1" x-on:click="$store.dashboard.addDimension()"
                            x-bind:disabled="!$store.dashboard.canAddDimension"
                            class="mt-1 text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                      <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar fila
                    </button>
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-ink/60 mb-1" x-text="$store.dashboard.pivotLabel"></label>
                    <div class="space-y-1">
                      <template x-for="(p, i) in $store.dashboard.drawerDraft.builder.pivots" :key="'piv-' + i">
                        <div class="space-y-1">
                        <div class="flex items-center gap-1">
                          <select x-model="$store.dashboard.drawerDraft.builder.pivots[i]" x-bind:disabled="!$store.dashboard.drawerWidgetClass.supportsPivot"
                                  class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500 disabled:opacity-50 disabled:cursor-not-allowed">
                            <option value="">Sin agrupar</option>
                            <template x-for="f in $store.dashboard.pivotOptionsAt(i)" :key="f">
                              <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder.pivots[i]"></option>
                            </template>
                          </select>
                          <button type="button" x-show="$store.dashboard.drawerDraft.builder.pivots.length > 1" x-on:click="$store.dashboard.removePivot(i)"
                                  class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none"
                                  title="Quitar nivel" aria-label="Quitar nivel de columnas">×</button>
                        </div>
                        <template x-if="$store.dashboard.drawerDraft.columnTotals">
                          <label x-show="$store.dashboard.drawerDraft.builder.pivots[i]" class="flex items-center gap-1.5 pl-1 text-[11px] text-ink/60 cursor-pointer"
                                 x-bind:title="i === 0 ? 'Columna «Total general» a la derecha' : `Subtotal «Total …» de cada ${$store.dashboard.drawerDraft.builder.pivots[i - 1] || 'grupo'}`">
                            <input type="checkbox" x-model="$store.dashboard.drawerDraft.columnTotals[i]"
                                   class="h-3.5 w-3.5 rounded border-line text-moss-600 focus:ring-moss-500">
                            Mostrar totales
                          </label>
                        </template>
                        </div>
                      </template>
                    </div>
                    <button type="button" x-show="$store.dashboard.maxPivots > 1" x-on:click="$store.dashboard.addPivot()"
                            x-bind:disabled="!$store.dashboard.canAddPivot"
                            class="mt-1 text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                      <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar columna
                    </button>
                  </div>
                </div>

                  <!-- Apiladas: solo barras con pivote -->
                  <label x-show="$store.dashboard.showStacked" class="flex items-center gap-2 text-xs font-semibold text-ink/70">
                    <input type="checkbox" x-model="$store.dashboard.drawerDraft.builder.stacked" class="h-4 w-4 rounded border-line text-moss-600 focus:ring-moss-500">
                    Apiladas en vez de lado a lado
                  </label>
                </div>

                <hr class="border-line/70 !mt-6" x-show="$store.dashboard.drawerWidgetClass.supportsDimension">

                <!-- Columnas a mostrar (widgets con usesColumns): las filas de la hoja tal cual, sin
                     agrupar; solo se eligen qué columnas y en qué orden. -->
                <template x-if="$store.dashboard.drawerWidgetClass.usesColumns">
                  <div class="space-y-2">
                    <div class="flex items-center gap-2">
                      <h3 class="text-[11px] font-semibold uppercase tracking-wide text-ink/60" x-text="$store.dashboard.drawerWidgetClass.columnsLabel"></h3>
                      <p class="text-[11px] text-ink/40" x-text="$store.dashboard.drawerWidgetClass.columnsHint"></p>
                    </div>
                    <div class="space-y-1" x-init="$store.dashboard.initColumnsList($el)">
                      <template x-for="(c, i) in $store.dashboard.drawerDraft.builder.columns" :key="'col-' + i">
                        <div class="space-y-1" data-column-row>
                        <div class="flex items-center gap-1">
                          <i class="ti ti-grip-vertical column-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-ink/30 hover:text-ink/60 select-none"
                             aria-hidden="true" title="Arrastra para reordenar"></i>
                          <select x-model="$store.dashboard.drawerDraft.builder.columns[i]" x-bind:aria-label="`Columna ${i + 1}`"
                                  class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                            <option value="" x-show="!$store.dashboard.drawerDraft.builder.columns[i]">Elige una columna…</option>
                            <template x-for="f in $store.dashboard.columnOptionsAt(i)" :key="f">
                              <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder.columns[i]"></option>
                            </template>
                          </select>
                          <!-- Tipo de control de la columna (caja de filtros: selector múltiple, rango…). -->
                          <template x-if="$store.dashboard.drawerWidgetClass.columnControls">
                            <select x-bind:value="$store.dashboard.columnControl(i)"
                                    x-on:change="$store.dashboard.setColumnControl(i, $event.target.value)"
                                    x-bind:disabled="!$store.dashboard.drawerDraft.builder.columns[i]" aria-label="Tipo de filtro"
                                    class="w-40 shrink-0 text-xs border border-line rounded-lg px-1.5 py-1.5 bg-white focus:outline-none focus:border-moss-500 disabled:opacity-50">
                              <template x-for="o in $store.dashboard.drawerWidgetClass.columnControls" :key="o.value">
                                <option x-bind:value="o.value" x-text="o.label" x-bind:disabled="o.disabled"
                                        x-bind:selected="o.value === $store.dashboard.columnControl(i)"></option>
                              </template>
                            </select>
                          </template>
                          <button type="button" x-on:click="$store.dashboard.removeColumn(i)"
                                  class="text-ink/40 hover:text-red-600 transition cursor-pointer px-1 text-base leading-none"
                                  title="Quitar columna" aria-label="Quitar columna">×</button>
                        </div>
                        <!-- Nombre a mostrar de la columna (ej. etiqueta del filtro); vacío = el de la columna. -->
                        <template x-if="$store.dashboard.drawerWidgetClass.supportsColumnLabels">
                          <input type="text" x-bind:value="$store.dashboard.columnLabel(i)"
                                 x-on:input="$store.dashboard.setColumnLabel(i, $event.target.value)"
                                 x-bind:placeholder="$store.dashboard.drawerDraft.builder.columns[i] || 'Nombre a mostrar'"
                                 x-bind:disabled="!$store.dashboard.drawerDraft.builder.columns[i]"
                                 aria-label="Nombre a mostrar" title="Nombre a mostrar (vacío: el nombre de la columna)"
                                 class="ml-5 w-[calc(100%-3.25rem)] text-xs border border-line rounded-lg px-2 py-1 focus:outline-none focus:border-moss-500 disabled:opacity-50">
                        </template>
                        </div>
                      </template>
                    </div>
                    <div class="flex items-center gap-3">
                      <button type="button" x-on:click="$store.dashboard.addColumn()" x-bind:disabled="!$store.dashboard.canAddColumn"
                              class="text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                        <i class="ti ti-plus text-sm" aria-hidden="true"></i>
                        <span x-text="$store.dashboard.drawerWidgetClass.addColumnLabel"></span>
                      </button>
                      <button type="button" x-show="$store.dashboard.drawerWidgetClass.allowAllColumns" x-on:click="$store.dashboard.useAllColumns()"
                              class="text-xs font-medium text-ink/60 hover:text-ink/80 cursor-pointer">
                        Usar todas
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Valores de ejemplo de las columnas de texto (autocompletar de los filtros) -->
                <template x-for="l in $store.dashboard.sampleLists" :key="l.id">
                  <datalist x-bind:id="l.id">
                    <template x-for="v in l.values" :key="v"><option x-bind:value="v"></option></template>
                  </datalist>
                </template>

                <!-- Métricas: cada una es una fila compacta; el detalle se despliega con el chevron.
                     Se ocultan en los widgets sin métricas (supportsMetrics = false). -->
                <div class="space-y-2 pt-3" x-show="$store.dashboard.drawerWidgetClass.supportsMetrics">
                  <div class="flex items-center gap-2">
                    <h3 class="text-[11px] font-semibold uppercase tracking-wide text-ink/60">Métricas</h3>
                    <p class="text-[11px] text-ink/40">lo que se mide y cómo se muestra</p>
                  </div>
                  <div class="divide-y divide-line/60 rounded-lg border border-line/70"
                       x-init="$store.dashboard.initMetricsList($el)">
                    <template x-for="(m, i) in $store.dashboard.drawerDraft.builder.metrics" :key="m._id">
                      <div class="p-1.5" x-bind:data-metric-id="m._id">
                        <!-- Fila compacta -->
                        <div class="flex items-center gap-1.5">
                          <i class="ti ti-grip-vertical metric-drag-handle shrink-0 cursor-grab active:cursor-grabbing text-base leading-none text-ink/30 hover:text-ink/60 select-none"
                             aria-hidden="true" title="Arrastra para reordenar"></i>

                          <select x-model="m.type" x-on:change="$store.dashboard.onMetricTypeChange(m)" aria-label="Tipo de métrica"
                                  x-bind:title="$store.dashboard.metricTypeLabel(m.type)"
                                  class="w-32 shrink-0 text-[11px] font-semibold text-ink/70 border border-line rounded-md px-1.5 py-1 bg-paper/60 focus:outline-none focus:border-moss-500">
                            <template x-for="t in $store.dashboard.metricTypes" :key="t.value">
                              <option x-bind:value="t.value" x-text="t.label" x-bind:selected="t.value === m.type"></option>
                            </template>
                          </select>

                          <!-- Resumir una columna -->
                          <template x-if="m.type === 'agg'">
                            <div class="flex items-center gap-1.5 min-w-0">
                              <select x-model="m.agg" title="Resumir por" aria-label="Resumir por"
                                      class="w-28 shrink-0 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                <template x-for="a in $store.dashboard.aggOptions" :key="a.value">
                                  <option x-bind:value="a.value" x-text="a.label" x-bind:selected="a.value === m.agg"></option>
                                </template>
                              </select>
                              <template x-if="!$store.dashboard.isCountAgg(m.agg)">
                                <select x-model="m.field" aria-label="Columna"
                                        class="w-28 shrink-0 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <option value="" x-text="m.agg === 'count_distinct' ? 'Elige una columna…' : 'Elige una columna numérica…'"></option>
                                  <template x-for="f in $store.dashboard.fieldOptionsFor(m.agg, m.field)" :key="f">
                                    <option x-bind:value="f" x-text="f" x-bind:selected="f === m.field"></option>
                                  </template>
                                </select>
                              </template>
                              <template x-if="$store.dashboard.isCountAgg(m.agg)">
                                <span class="w-28 shrink-0 truncate text-xs text-ink/50">Cantidad de filas</span>
                              </template>
                            </div>
                          </template>

                          <template x-if="m.type === 'calc'">
                            <span class="flex-1 min-w-0 truncate text-xs text-ink/50">Cálculo entre las métricas anteriores</span>
                          </template>

                          <template x-if="m.type === 'grouped'">
                            <span class="flex-1 min-w-0 truncate text-xs text-ink/50">Condición o ranking por grupo</span>
                          </template>

                          <input type="text" x-model="m.label" x-show="$store.dashboard.drawerSupportsLabels"
                                 x-bind:placeholder="$store.dashboard.metricLabelPlaceholder(i)"
                                 aria-label="Nombre a mostrar de la métrica"
                                 class="flex-1 min-w-[5rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">

                          <button type="button" x-on:click="m.expanded = !m.expanded"
                                  class="shrink-0 text-ink/40 hover:text-ink/70 transition cursor-pointer px-0.5 text-sm leading-none"
                                  x-bind:aria-expanded="!!m.expanded"
                                  x-bind:title="m.expanded ? 'Ocultar el detalle de la métrica' : 'Ver el detalle de la métrica'"
                                  aria-label="Ver el detalle de la métrica">
                            <i class="ti" x-bind:class="m.expanded ? 'ti-chevron-down' : 'ti-chevron-right'" aria-hidden="true"></i>
                          </button>

                          <button type="button" x-on:click="$store.dashboard.removeBuilderMetric(i)"
                                  x-bind:disabled="$store.dashboard.drawerDraft.builder.metrics.length <= 1"
                                  class="shrink-0 text-ink/40 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:text-ink/40 transition cursor-pointer px-0.5 text-base leading-none"
                                  title="Quitar métrica" aria-label="Quitar métrica">×</button>
                        </div>

                        <!-- Detalle desplegable -->
                        <div x-show="m.expanded" class="mt-2 pl-5 space-y-1.5 border-t border-dashed border-line/60 pt-2">
                          <template x-if="m.type === 'agg' && $store.dashboard.drawerWidgetClass.supportsShowAs">
                            <div class="flex items-center gap-1.5">
                              <span class="w-28 shrink-0 text-[11px] font-semibold text-ink/50">Mostrar como</span>
                              <select x-model="m.show_as" aria-label="Mostrar como" class="flex-1 min-w-0 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                <template x-for="o in $store.dashboard.showAsOptions" :key="o.value">
                                  <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.showAsValue(m)"></option>
                                </template>
                              </select>
                            </div>
                          </template>

                          <!-- Cálculo entre métricas anteriores -->
                          <template x-if="m.type === 'calc'">
                            <div class="space-y-1">
                              <p x-show="!$store.dashboard.metricRefOptions(i).length" class="text-[11px] text-clay-600">
                                Agrega antes las métricas con las que quieres calcular.
                              </p>
                              <div class="flex flex-wrap items-center gap-1">
                                <select x-model="m.left" aria-label="Primera métrica" class="flex-1 min-w-[7rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <option value="">Elige una métrica…</option>
                                  <template x-for="o in $store.dashboard.metricRefOptions(i)" :key="o.value">
                                    <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === m.left"></option>
                                  </template>
                                </select>
                                <select x-model="m.op" aria-label="Operación" class="w-28 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <template x-for="o in $store.dashboard.calcOpOptions" :key="o.value">
                                    <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === m.op"></option>
                                  </template>
                                </select>
                                <select x-model="m.rightKind" aria-label="Operar con" class="w-24 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <option value="metric">métrica</option>
                                  <option value="number">número</option>
                                </select>
                                <template x-if="m.rightKind === 'metric'">
                                  <select x-model="m.right" aria-label="Segunda métrica" class="flex-1 min-w-[7rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                    <option value="">Elige una métrica…</option>
                                    <template x-for="o in $store.dashboard.metricRefOptions(i)" :key="o.value">
                                      <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === m.right"></option>
                                    </template>
                                  </select>
                                </template>
                                <template x-if="m.rightKind === 'number'">
                                  <input type="number" x-model="m.right" placeholder="Número" aria-label="Número" class="w-24 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                </template>
                              </div>
                            </div>
                          </template>

                          <!-- Por grupo (solo KPI): condición sobre grupos o ranking -->
                          <template x-if="m.type === 'grouped'">
                            <div class="space-y-1.5">
                              <div class="flex items-center gap-1.5">
                                <span class="w-28 shrink-0 text-[11px] font-semibold text-ink/50">Agrupar por</span>
                                <select x-model="m.group_by" class="flex-1 min-w-0 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <option value="">Elige una columna…</option>
                                  <template x-for="f in $store.dashboard.schema.dimension_fields" :key="f">
                                    <option x-bind:value="f" x-text="f" x-bind:selected="f === m.group_by"></option>
                                  </template>
                                </select>
                              </div>
                              <div class="pl-1">
                                <span class="block text-[11px] font-semibold text-ink/50 mb-0.5">En cada grupo, calcular</span>
                                <div class="space-y-1">
                                  <template x-for="(x, xi) in m.inner" :key="x._id">
                                    <div class="flex items-center gap-1">
                                      <select x-model="x.agg" aria-label="Resumir por" class="w-28 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                        <template x-for="a in $store.dashboard.aggOptions" :key="a.value">
                                          <option x-bind:value="a.value" x-text="a.label" x-bind:selected="a.value === x.agg"></option>
                                        </template>
                                      </select>
                                      <template x-if="!$store.dashboard.isCountAgg(x.agg)">
                                        <select x-model="x.field" aria-label="Columna" class="flex-1 min-w-0 text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                          <option value="">Elige una columna…</option>
                                          <template x-for="f in $store.dashboard.fieldOptionsFor(x.agg, x.field)" :key="f">
                                            <option x-bind:value="f" x-text="f" x-bind:selected="f === x.field"></option>
                                          </template>
                                        </select>
                                      </template>
                                      <template x-if="$store.dashboard.isCountAgg(x.agg)">
                                        <span class="flex-1 min-w-0 text-xs text-ink/50">Cantidad de filas</span>
                                      </template>
                                      <button type="button" x-on:click="$store.dashboard.removeInnerMetric(m, xi)" x-bind:disabled="m.inner.length <= 1"
                                              class="text-ink/40 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed transition cursor-pointer px-1 text-base leading-none"
                                              title="Quitar" aria-label="Quitar métrica del grupo">×</button>
                                    </div>
                                  </template>
                                </div>
                                <button type="button" x-show="m.inner.length < 3" x-on:click="$store.dashboard.addInnerMetric(m)"
                                        class="mt-1 text-xs font-medium text-moss-700 hover:text-moss-800 cursor-pointer flex items-center gap-1">
                                  <i class="ti ti-plus text-sm" aria-hidden="true"></i> Agregar cálculo
                                </button>
                              </div>
                              <div class="pl-1">
                                <span class="block text-[11px] font-semibold text-ink/50 mb-0.5">Solo los grupos donde <span class="font-normal text-ink/40">(opcional)</span></span>
                                {% include "partials/builder_group_conditions.html" with list="m.innerHaving" options="$store.dashboard.innerRefOptions(m)" %}
                              </div>
                              <div class="flex flex-wrap items-center gap-1.5">
                                <span class="w-28 shrink-0 text-[11px] font-semibold text-ink/50">Mostrar</span>
                                <select x-model="m.result" class="flex-1 min-w-[8rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                  <template x-for="o in $store.dashboard.groupResultOptions" :key="o.value">
                                    <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === m.result"></option>
                                  </template>
                                </select>
                                <template x-if="$store.dashboard.groupResultNeedsValue(m)">
                                  <select x-model="m.value" aria-label="De qué cálculo" class="flex-1 min-w-[8rem] text-xs border border-line rounded-md px-1.5 py-1 bg-white focus:outline-none focus:border-moss-500">
                                    <option value="">Elige un cálculo…</option>
                                    <template x-for="o in $store.dashboard.innerRefOptions(m)" :key="o.value">
                                      <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === m.value"></option>
                                    </template>
                                  </select>
                                </template>
                              </div>
                            </div>
                          </template>

                          <!-- El filtro por métrica solo se ofrece en el KPI, que es donde su
                               porcentaje se calcula sobre el valor SIN esas condiciones. -->
                          <template x-if="$store.dashboard.drawerIsKpi && m.type !== 'calc'">
                            <div class="pl-1">
                              <span class="block text-[11px] font-semibold text-ink/50 mb-0.5">Usar solo algunas filas de la hoja para esta métrica</span>
                              {% include "partials/builder_conditions.html" with list="m.filters" %}
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                  <button type="button" x-show="$store.dashboard.maxMetrics > 1"
                          x-on:click="$store.dashboard.addBuilderMetric()"
                          x-bind:disabled="$store.dashboard.drawerDraft.builder.metrics.length >= $store.dashboard.maxMetrics"
                          class="text-xs font-medium text-moss-700 hover:text-moss-800 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                    <i class="ti ti-plus text-sm" aria-hidden="true"></i>
                    <span x-text="$store.dashboard.drawerDraft.builder.metrics.length >= $store.dashboard.maxMetrics ? `Máximo ${$store.dashboard.maxMetrics} métricas` : 'Agregar métrica'"></span>
                  </button>

                  <!-- Tarjeta KPI: roles de las métricas (solo presentación) -->
                  <template x-if="$store.dashboard.drawerIsKpi">
                    <div class="rounded-lg border border-line/70 p-2 space-y-1.5">
                      <span class="block text-[11px] font-semibold text-ink/60">Tarjeta</span>
                    <div class="flex items-center gap-1.5">
                      <span class="w-32 text-[11px] font-semibold text-ink/50 pl-1">Número principal</span>
                      <select x-model="$store.dashboard.drawerDraft.builder.kpi.primary" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="">La primera métrica</option>
                        <template x-for="o in $store.dashboard.metricRefOptions(null, { numericOnly: false })" :key="o.value">
                          <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.drawerDraft.builder.kpi.primary"></option>
                        </template>
                      </select>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <span class="w-32 text-[11px] font-semibold text-ink/50 pl-1">Comparar con</span>
                      <select x-model="$store.dashboard.drawerDraft.builder.kpi.compare" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="">Sin comparación</option>
                        <template x-for="o in $store.dashboard.metricRefOptions()" :key="o.value">
                          <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.drawerDraft.builder.kpi.compare"></option>
                        </template>
                      </select>
                      <select x-show="$store.dashboard.drawerDraft.builder.kpi.compare" x-model="$store.dashboard.drawerDraft.builder.kpi.compareMode"
                              aria-label="Cómo mostrar la variación" class="w-32 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="pct">Variación %</option>
                        <option value="abs">Diferencia</option>
                      </select>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <span class="w-32 text-[11px] font-semibold text-ink/50 pl-1">Meta</span>
                      <select x-model="$store.dashboard.drawerDraft.builder.kpi.targetKind" class="w-32 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="none">Sin meta</option>
                        <option value="number">Un número</option>
                        <option value="metric">Una métrica</option>
                      </select>
                      <template x-if="$store.dashboard.drawerDraft.builder.kpi.targetKind === 'number'">
                        <input type="number" x-model="$store.dashboard.drawerDraft.builder.kpi.targetValue" placeholder="Ej. 50000"
                               aria-label="Valor de la meta" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                      </template>
                      <template x-if="$store.dashboard.drawerDraft.builder.kpi.targetKind === 'metric'">
                        <select x-model="$store.dashboard.drawerDraft.builder.kpi.targetMetric" aria-label="Métrica de la meta" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                          <option value="">Elige una métrica…</option>
                          <template x-for="o in $store.dashboard.metricRefOptions()" :key="o.value">
                            <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.drawerDraft.builder.kpi.targetMetric"></option>
                          </template>
                        </select>
                      </template>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <span class="w-32 text-[11px] font-semibold text-ink/50 pl-1">Semáforo</span>
                      <select x-model="$store.dashboard.drawerDraft.builder.kpi.statusBasis" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="none">Sin colores</option>
                        <option value="target_pct" x-bind:disabled="$store.dashboard.drawerDraft.builder.kpi.targetKind === 'none'">Según el % de la meta</option>
                        <option value="value">Según el valor</option>
                      </select>
                    </div>
                    <template x-if="$store.dashboard.drawerDraft.builder.kpi.statusBasis !== 'none'">
                      <div class="flex items-center gap-1.5 pl-1">
                        <span class="w-[7.6rem] text-[11px] text-ink/50" x-text="$store.dashboard.drawerDraft.builder.kpi.higherIsBetter ? 'Verde desde / ámbar desde' : 'Verde hasta / ámbar hasta'"></span>
                        <input type="number" x-model="$store.dashboard.drawerDraft.builder.kpi.good" aria-label="Umbral verde" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <input type="number" x-model="$store.dashboard.drawerDraft.builder.kpi.warn" aria-label="Umbral ámbar" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                      </div>
                    </template>
                    <label class="flex items-center gap-1.5 pl-1 text-[11px] text-ink/60 cursor-pointer"
                           title="Invierte los colores de la variación y del semáforo (costos, quejas, tiempos…)">
                      <input type="checkbox" x-bind:checked="!$store.dashboard.drawerDraft.builder.kpi.higherIsBetter"
                             x-on:change="$store.dashboard.drawerDraft.builder.kpi.higherIsBetter = !$event.target.checked"
                             class="h-3.5 w-3.5 rounded border-line text-moss-600 focus:ring-moss-500">
                      Menos es mejor
                    </label>
                    <div class="flex items-center gap-1.5">
                      <span class="w-32 text-[11px] font-semibold text-ink/50 pl-1">Tendencia por</span>
                      <select x-model="$store.dashboard.drawerDraft.builder.trendBy" class="flex-1 min-w-0 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="">Sin tendencia</option>
                        <template x-for="f in $store.dashboard.schema.dimension_fields" :key="f">
                          <option x-bind:value="f" x-text="f" x-bind:selected="f === $store.dashboard.drawerDraft.builder.trendBy"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                </template>
                </div>

                <hr class="border-line/70 !mt-6" x-show="$store.dashboard.drawerWidgetClass.supportsConditions">

                <!-- Filtros: qué filas de la hoja entran al widget (WHERE) -->
                <div class="space-y-2 pt-3" x-show="$store.dashboard.drawerWidgetClass.supportsConditions">
                  <div class="flex items-center gap-2">
                    <h3 class="text-[11px] font-semibold uppercase tracking-wide text-ink/60">Filtros</h3>
                    <p class="text-[11px] text-ink/40">qué filas de la hoja se usan</p>
                  </div>
                  {% include "partials/builder_conditions.html" with list="$store.dashboard.drawerDraft.builder.filters" %}
                </div>

                <hr class="border-line/70 !mt-6" x-show="$store.dashboard.drawerWidgetClass.supportsConditions">

                <!-- Widgets con columnas sueltas: orden de las filas por una de sus columnas. -->
                <template x-if="$store.dashboard.drawerWidgetClass.usesColumns && $store.dashboard.drawerWidgetClass.supportsSort">
                  <div class="grid grid-cols-2 gap-2 pt-3">
                    <div>
                      <label class="block text-[11px] font-semibold text-ink/60 mb-1">Ordenar por</label>
                      <select x-model="$store.dashboard.drawerDraft.builder.sortBy" class="w-full text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <option value="">Orden de la hoja</option>
                        <template x-for="o in $store.dashboard.sortOptions" :key="o.value">
                          <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.drawerDraft.builder.sortBy"></option>
                        </template>
                      </select>
                    </div>
                    <div>
                      <label class="block text-[11px] font-semibold text-ink/60 mb-1">Dirección</label>
                      <select x-model="$store.dashboard.drawerDraft.builder.sortDir" x-bind:disabled="!$store.dashboard.drawerDraft.builder.sortBy" class="w-full text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500 disabled:opacity-50">
                        <option value="desc">Mayor a menor</option>
                        <option value="asc">Menor a mayor</option>
                      </select>
                    </div>
                  </div>
                </template>

                <!-- Filtrar resultado: condición sobre los grupos de la primera fila/categoría y Top N.
                     Solo donde hay grupos: el KPI es un único total. -->
                <template x-if="$store.dashboard.drawerWidgetClass.supportsDimension">
                  <div class="space-y-3">
                    <div class="space-y-2 pt-3">
                      <div class="flex items-center gap-2">
                        <h3 class="text-[11px] font-semibold uppercase tracking-wide text-ink/60">Filtrar resultado</h3>
                        <p class="text-[11px] text-ink/40">según el valor ya calculado</p>
                      </div>
                      {% include "partials/builder_group_conditions.html" with list="$store.dashboard.drawerDraft.builder.having" options="$store.dashboard.metricRefOptions()" %}
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-[11px] font-semibold text-ink/60 mb-1">Ordenar por</label>
                        <select x-model="$store.dashboard.drawerDraft.builder.sortBy" class="w-full text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                          <option value="">Orden de la hoja</option>
                          <template x-for="o in $store.dashboard.sortOptions" :key="o.value">
                            <option x-bind:value="o.value" x-text="o.label" x-bind:selected="o.value === $store.dashboard.drawerDraft.builder.sortBy"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="block text-[11px] font-semibold text-ink/60 mb-1">Dirección</label>
                        <select x-model="$store.dashboard.drawerDraft.builder.sortDir" x-bind:disabled="!$store.dashboard.drawerDraft.builder.sortBy" class="w-full text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500 disabled:opacity-50">
                          <option value="desc">Mayor a menor</option>
                          <option value="asc">Menor a mayor</option>
                        </select>
                      </div>
                    </div>

                    <div class="space-y-1">
                      <div class="flex items-center gap-2">
                        <label class="text-[11px] font-semibold text-ink/60">Mostrar solo los primeros</label>
                        <input type="number" min="1" max="100" x-model="$store.dashboard.drawerDraft.builder.limitN" placeholder="Todos"
                               aria-label="Top N" class="w-20 text-sm border border-line rounded-lg px-2 py-1.5 focus:outline-none focus:border-moss-500">
                        <label x-show="$store.dashboard.drawerDraft.builder.limitN" class="flex items-center gap-1.5 text-[11px] text-ink/60 cursor-pointer">
                          <input type="checkbox" x-model="$store.dashboard.drawerDraft.builder.limitOthers"
                                 class="h-3.5 w-3.5 rounded border-line text-moss-600 focus:ring-moss-500">
                          Agrupar el resto en «Otros»
                        </label>
                      </div>
                      <p x-show="$store.dashboard.limitNeedsMetricSort" class="text-[11px] text-clay-600">
                        Para un Top N elige en «Ordenar por» la métrica que define quiénes son los primeros.
                      </p>
                    </div>
                  </div>
                </template>

                <!-- Visor JSON de solo lectura -->
                <details class="text-[11px]">
                  <summary class="cursor-pointer text-ink/50 hover:text-ink/70 select-none">Ver JSON del widget</summary>
                  <div class="mt-2 space-y-2">
                    <div>
                      <div class="font-semibold text-ink/60 mb-0.5">data_spec</div>
                      <pre class="font-mono text-[11px] bg-paper border border-line rounded-lg p-2 max-h-56 overflow-auto whitespace-pre"
                           x-text="JSON.stringify($store.dashboard.drawerSpecs.data_spec, null, 2)"></pre>
                    </div>
                    <div>
                      <div class="font-semibold text-ink/60 mb-0.5">view_spec</div>
                      <pre class="font-mono text-[11px] bg-paper border border-line rounded-lg p-2 max-h-56 overflow-auto whitespace-pre"
                           x-text="JSON.stringify($store.dashboard.drawerSpecs.view_spec, null, 2)"></pre>
                    </div>
                  </div>
                </details>
              </div>
            </template>

            <template x-if="field.type === 'number'">
              <input type="number" x-model.number="$store.dashboard.drawerDraft[field.key]"
                     x-bind:min="field.min" x-bind:step="field.step || 1"
                     class="w-full text-sm border border-line rounded-lg px-3 py-2 focus:outline-none focus:border-moss-500">
            </template>

            <template x-if="field.type === 'select'">
              <select x-model="$store.dashboard.drawerDraft[field.key]"
                      x-on:change="field.key === 'width' && $store.dashboard.fitStartCol()"
                      class="w-full text-sm border border-line rounded-lg px-3 py-2 focus:outline-none focus:border-moss-500">
                <template x-for="opt in field.options" :key="opt.value">
                  <option x-bind:value="opt.value" x-text="opt.label"></option>
                </template>
              </select>
            </template>

            <template x-if="field.type === 'range'">
              <div class="flex items-center gap-3">
                <input type="range" x-model.number="$store.dashboard.drawerDraft[field.key]"
                       x-bind:min="field.min" x-bind:max="field.max" x-bind:step="field.step || 1"
                       class="flex-1 h-2 rounded-lg appearance-none cursor-pointer bg-line accent-moss-500">
                <span class="text-sm font-semibold text-ink/70 min-w-[2ch] text-center"
                      x-text="$store.dashboard.drawerDraft[field.key]"></span>
              </div>
            </template>

            <template x-if="field.type === 'checkbox'">
              <input type="checkbox" x-model="$store.dashboard.drawerDraft[field.key]"
                     class="h-4 w-4 rounded border-line text-moss-600 focus:ring-moss-500">
            </template>
          </div>
        </template>
      </template>
    </div>
    </div>

    <div class="px-5 py-4 border-t border-line">
      <p x-show="$store.dashboard.drawerSaveError" x-text="$store.dashboard.drawerSaveError" class="mb-3 text-xs text-red-600"></p>
      <div class="flex space-x-2">
        <button x-on:click="$store.dashboard.closeDrawer()" class="flex-1 text-sm font-medium text-ink/60 bg-paper hover:bg-line rounded-lg py-2 transition cursor-pointer">Cancelar</button>
        <button x-on:click="$store.dashboard.saveDrawer()" x-bind:disabled="$store.dashboard.drawerSaving"
                class="flex-1 text-sm font-medium text-white bg-moss-500 hover:bg-moss-600 disabled:opacity-50 rounded-lg py-2 transition cursor-pointer"
                x-text="$store.dashboard.drawerSaving ? 'Guardando…' : 'Guardar'"></button>
      </div>
    </div>
  </div>
  </aside>

</div>

<script>
  window.DASHBOARD_ID = {{ dashboard.id }};
  window.SHARE_PATH = "{% url 'board_view' dashboard_id=dashboard.id %}";
  window.REFRESH_MINUTES = {{ refresh_minutes|default:0 }};
</script>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.js"></script>

<script src="{% static 'sheets_reports/js/board_editor/base-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widget-registry.js' %}"></script>

<script src="{% static 'sheets_reports/js/board_editor/widgets/bar-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/line-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/donut-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/kpi-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/dynamic-table-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/table-widget.js' %}"></script>
<script src="{% static 'sheets_reports/js/board_editor/widgets/filter-widget.js' %}"></script>

<script src="{% static 'sheets_reports/js/board_editor/dashboard-store.js' %}"></script>

{% endblock %}
