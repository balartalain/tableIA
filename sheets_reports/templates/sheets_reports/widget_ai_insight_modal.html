{% comment %}
Ventana modal emergente con el análisis interpretativo del widget generado con IA (Markdown).
{% endcomment %}
<div x-data="widgetAiInsightModal()" x-cloak>
  <template x-teleport="body">
    <div x-show="open" 
         x-on:keydown.escape.window="open = false"
         class="fixed inset-0 z-50 bg-ink/40 backdrop-blur-xs flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">

      <div x-on:click.outside="open = false"
           role="dialog" aria-modal="true"
           class="bg-white rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col border border-line shadow-2xl overflow-hidden"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 scale-95 translate-y-2"
           x-transition:enter-end="opacity-100 scale-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 scale-100 translate-y-0"
           x-transition:leave-end="opacity-0 scale-95 translate-y-2">

        <!-- Cabecera -->
        <div class="px-5 py-3.5 bg-paper/60 border-b border-line flex items-center justify-between gap-3 shrink-0">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">
              <i class="ti ti-bulb text-xl" aria-hidden="true"></i>
            </span>
            <div class="min-w-0">
              <h3 class="text-xs font-bold text-ink truncate" x-text="title || 'Análisis del gráfico'"></h3>
              <p class="text-[10px] text-ink/50 truncate">Interpretación analítica de los datos</p>
            </div>
          </div>

          <div class="flex items-center gap-1">
            <button type="button" x-show="insight && !loading" x-on:click="copy()"
                    title="Copiar texto" aria-label="Copiar texto"
                    class="p-1.5 rounded-md text-ink/40 hover:text-ink hover:bg-paper transition cursor-pointer">
              <i class="ti ti-copy text-base" aria-hidden="true"></i>
            </button>
            <button type="button" x-on:click="open = false"
                    title="Cerrar" aria-label="Cerrar"
                    class="p-1.5 rounded-md text-ink/40 hover:text-ink hover:bg-paper transition cursor-pointer">
              <i class="ti ti-x text-base" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Contenido -->
        <div class="flex-1 min-h-0 overflow-y-auto p-5 text-xs text-ink/90 leading-relaxed">
          <!-- Loader -->
          <div x-show="loading" class="py-12 flex flex-col items-center justify-center gap-3 text-center">
            <div class="w-10 h-10 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center">
              <i class="ti ti-loader-2 text-2xl animate-spin text-violet-600"></i>
            </div>
            <div class="space-y-1">
              <p class="font-semibold text-ink text-xs">Analizando datos del gráfico con IA…</p>
              <p class="text-[11px] text-ink/50 max-w-xs">Identificando tendencias, máximos, mínimos y conclusiones clave.</p>
            </div>
          </div>

          <!-- Error -->
          <div x-show="error && !loading" class="p-3 rounded-lg border border-red-200 bg-red-50 text-red-700 space-y-1" role="alert">
            <p class="font-semibold flex items-center gap-1">
              <i class="ti ti-alert-circle"></i>
              <span>No se pudo generar el análisis</span>
            </p>
            <p x-text="error"></p>
            <button type="button" x-on:click="fetchInsight(widgetId, title)" class="mt-2 text-[11px] underline font-medium cursor-pointer">Reintentar</button>
          </div>

          <!-- Texto Markdown -->
          <div x-show="insight && !loading" class="prose prose-xs max-w-none text-ink leading-relaxed space-y-2" x-html="renderMarkdown(insight)"></div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function widgetAiInsightModal() {
  return {
    open: false,
    loading: false,
    error: '',
    title: '',
    widgetId: null,
    insight: '',

    init() {
      window.addEventListener('widget:ai-insight', (e) => {
        if (e.detail && e.detail.id) {
          this.fetchInsight(e.detail.id, e.detail.title);
        }
      });
    },

    async fetchInsight(widgetId, title) {
      this.widgetId = widgetId;
      this.title = title || '';
      this.open = true;
      this.loading = true;
      this.error = '';
      this.insight = '';

      try {
        const store = Alpine.store('dashboard');
        const qs = store && store.getFilterQueryString ? store.getFilterQueryString() : '';
        const url = apiUrl(`/api/widget/${widgetId}/ai-insight/` + (qs ? `?${qs}` : ''));

        const r = await fetch(url);
        const data = await r.json().catch(() => null);

        if (!r.ok || !data || data.error) {
          throw new Error((data && data.error) || `Error ${r.status}`);
        }

        this.insight = data.text || '';
      } catch (e) {
        this.error = e.message || 'Error al conectar con el servidor.';
      } finally {
        this.loading = false;
      }
    },

    renderMarkdown(text) {
      if (!text) return '';
      if (window.marked && typeof window.marked.parse === 'function') {
        try {
          return window.marked.parse(text);
        } catch (e) {}
      }
      return text.replace(/\n/g, '<br>');
    },

    copy() {
      if (this.insight && navigator.clipboard) {
        navigator.clipboard.writeText(this.insight);
        if (typeof window.showToast === 'function') {
          window.showToast('Análisis copiado al portapapeles');
        }
      }
    }
  };
}
</script>
