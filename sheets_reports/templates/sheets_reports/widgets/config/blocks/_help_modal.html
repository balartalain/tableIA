{% comment %}Ventana emergente de ayuda (panel de widgets y editor de la fuente), fuera del panel (body) para
que no la recorte ni la tape.
Parámetros: `flag` (variable Alpine que la abre), `title`, `icon` (clase de Tabler) y `body`
(plantilla con el contenido).{% endcomment %}
<template x-teleport="body">
  <div x-show="{{ flag }}" x-cloak x-on:keydown.escape.window="{{ flag }} = false"
       class="fixed inset-0 z-50 bg-ink/40 flex items-center justify-center p-4">
    <div x-on:click.outside="{{ flag }} = false" role="dialog" aria-modal="true" aria-labelledby="{{ flag }}-title"
         class="bg-white rounded w-full max-w-3xl max-h-[85vh] flex flex-col border border-line shadow-xl">
      <div class="flex items-center gap-2.5 px-5 py-2.5 border-b border-line">
        <i class="ti {{ icon }} text-base text-moss-600" aria-hidden="true"></i>
        <h2 id="{{ flag }}-title" class="flex-1 text-sm font-semibold text-ink">{{ title }}</h2>
        <button type="button" x-on:click="{{ flag }} = false" aria-label="Cerrar"
                class="p-1 rounded-md text-ink/50 hover:text-ink hover:bg-paper cursor-pointer">
          <i class="ti ti-x text-base leading-none" aria-hidden="true"></i>
        </button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-4">
        {% include body %}
      </div>
    </div>
  </div>
</template>
